<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="charcoal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#393b39"/><stop offset=".24" stop-color="#353634"/><stop offset=".58" stop-color="#2b2e2d"/><stop offset="1" stop-color="#1a2021"/></linearGradient>
 <radialGradient id="daylight" cx=".06" cy=".06" r=".91" fx="0" fy="0"><stop stop-color="#d3c4ac" stop-opacity=".28"/><stop offset=".34" stop-color="#c0af98" stop-opacity=".10"/><stop offset=".8" stop-color="#a6957a" stop-opacity="0"/></radialGradient>
 <radialGradient id="vignette"><stop offset=".48" stop-color="#060b0d" stop-opacity="0"/><stop offset="1" stop-color="#050709" stop-opacity=".42"/></radialGradient>
 <filter id="plaster" x="0" y="0" width="100%" height="100%">
   <feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="4" seed="37" stitchTiles="stitch"/>
   <feColorMatrix type="saturate" values="0"/>
   <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
 </filter>
 <filter id="largeGrain" x="0" y="0" width="100%" height="100%">
   <feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="5" stitchTiles="stitch"/>
   <feColorMatrix type="saturate" values="0"/>
   <feComponentTransfer><feFuncA type="linear" slope=".035"/></feComponentTransfer>
 </filter>
</defs>
<rect width="1920" height="1080" fill="url(#charcoal)"/>
<rect width="1920" height="1080" fill="url(#daylight)"/>
<rect width="1920" height="1080" fill="#d0bfa7" opacity=".75" filter="url(#largeGrain)"/>
<rect width="1920" height="1080" fill="#c5c1b7" filter="url(#plaster)"/>
<rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>