name: FORMA botanical visual QA
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'forma-landscape-3d-vegetation.js'
      - 'forma-landscape-3d-understory.js'
      - 'forma-landscape-3d-reference-canopies.js'
      - 'tests/landscape-botanical-overhaul-reference.test.mjs'
      - 'forma-landscape-3d-botany.js'
      - 'forma-landscape-3d-foliage-lod.js'
      - 'forma-landscape-3d-plant-materials.js'
      - 'tests/landscape-botany-reference.verify.mjs'
      - 'forma-landscape-3d-geometry.js'
      - 'forma-landscape-3d.html'
      - 'tests/landscape-botany-browser.verify.mjs'
      - '.github/workflows/landscape-botany-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - name: Check real 3D botanical silhouettes in Chromium
        run: |
          node server.mjs > /tmp/forma-botany-server.log 2>&1 &
          sleep 2
          node tests/landscape-botany-browser.verify.mjs
          node tests/landscape-botany-reference.verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-botanical-visual-qa
          path: |
            artifacts/landscape-editor/botanical-ten-species-*.png
            artifacts/landscape-editor/botany-reference-*.png
