name: FORMA - Barberry authored GLB integration regression
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'forma-landscape-3d-shrub-models.js'
      - 'forma-landscape-3d-models.js'
      - 'tests/landscape-barberry-original-glb.test.mjs'
      - 'assets/landscape-models/barberry-thunberg-forma-original.glb'
      - 'assets/landscape-models/barberry-thunberg-forma-original.source.json'
      - '.github/workflows/forma-barberry-integration-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Test 3 real shrub GLBs, authored Barberry and editor
        run: node --test tests/landscape-barberry-original-glb.test.mjs tests/landscape-spirea-chosen-glb.test.mjs tests/landscape-real-hydrangea.test.mjs tests/landscape-shrub-editor-interaction.test.mjs
