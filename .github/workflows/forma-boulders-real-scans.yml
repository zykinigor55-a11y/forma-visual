name: FORMA - inspect four real Poly Haven rock GLBs in Three.js
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'forma-boulders-qa.html'
      - 'tools/capture_existing_rock_scans.mjs'
      - '.github/workflows/forma-boulders-real-scans.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start actual DOM.RENDER 3D server
        run: |
          PORT=3000 HOST=127.0.0.1 node server.mjs >/tmp/forma-rocks.log 2>&1 &
          for i in $(seq 1 35); do
            curl -fsS http://127.0.0.1:3000/forma-boulders-qa.html >/dev/null && break
            sleep 1
          done
      - name: Render all four genuine CC0 3D rock assets
        run: node tools/capture_existing_rock_scans.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boulders-four-existing-CC0-photo-PBR-scans
          path: |
            assets/landscape-screenshots/boulder-cc0-four-existing-scans-qa.png
            assets/landscape-screenshots/boulder-cc0-scans-proof.json
      - name: Save unretouched actual WebGL screenshot in GitHub
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/landscape-screenshots/boulder-cc0-four-existing-scans-qa.png assets/landscape-screenshots/boulder-cc0-scans-proof.json
          git commit -m 'visual(boulders): original four CC0 Poly Haven PBR scans rendered in actual WebGL'
          git push origin HEAD:dom-render-nanobanana || (git pull --rebase origin dom-render-nanobanana && git push origin HEAD:dom-render-nanobanana)
