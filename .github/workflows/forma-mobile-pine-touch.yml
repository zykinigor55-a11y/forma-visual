name: FORMA · Android pine touch selection
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'forma-landscape-3d.html'
      - 'forma-landscape-pine-growth.js'
      - 'forma-landscape-pine-sizing.css'
      - 'tests/landscape-mobile-pine-touch.verify.mjs'
      - '.github/workflows/forma-mobile-pine-touch.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forma-mobile-pine-touch
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - name: Test actual touch selection, pine picker and saved sliders at phone viewport
        run: |
          node server.mjs > /tmp/mobile-pine-server.log 2>&1 &
          sleep 2
          node tests/landscape-mobile-pine-touch.verify.mjs
