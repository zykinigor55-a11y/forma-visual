name: FORMA - build original Buxus sempervirens PBR GLB
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'tools/boxwood-sempervirens-v1.py.xz.b64'
      - '.github/workflows/forma-boxwood-original-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forma-boxwood-original-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generate-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out actual DOM.RENDER editor
        uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original geometry toolchain
        run: python -m pip install --quiet 'numpy==2.3.5' 'trimesh==4.11.1' 'pillow==12.3.0'
      - name: Restore FORMA boxwood generator and create 3 original crowns
        run: |
          base64 --decode tools/boxwood-sempervirens-v1.py.xz.b64 | xz --decompress > tools/generate_boxwood_sempervirens.py
          python -m py_compile tools/generate_boxwood_sempervirens.py
          python tools/generate_boxwood_sempervirens.py assets/landscape-models/boxwood-sempervirens-forma-original.glb assets/landscape-models/boxwood-sempervirens-forma-original.source.json
      - name: Check exact GLB geometry and integrity
        run: |
          python - <<'PY'
          import json,hashlib,struct
          from pathlib import Path
          p=Path('assets/landscape-models/boxwood-sempervirens-forma-original.glb')
          b=p.read_bytes()
          meta=json.loads(Path('assets/landscape-models/boxwood-sempervirens-forma-original.source.json').read_text())
          sha=hashlib.sha256(b).hexdigest()
          assert b[:4]==b'glTF' and struct.unpack_from('<I',b,4)[0]==2 and struct.unpack_from('<I',b,8)[0]==len(b)
          assert sha==meta['sha256']=='83d3a0041c863144ae4fe21bc78795785c8ded104b8559dcd3645528d0adb296',sha
          assert meta['triangles']==373880 and meta['meshCount']==30 and meta['materialCount']==10
          assert meta['sizeBytes']==10092168
          forms=meta['forms']
          assert forms['BOXWOOD_NATURAL']['leafCount']==30780
          assert forms['BOXWOOD_SPHERE']['leafCount']==24300
          assert forms['BOXWOOD_HEDGE']['leafCount']==37080
          for k in forms:assert forms[k]['triangles']>98000
          print('Verified original boxwood GLB',meta['sizeBytes'],sha)
          PY
      - name: Run original GLB and landscape shrub editor tests
        run: |
          node --test tests/landscape-boxwood-original-glb.test.mjs tests/landscape-shrub-editor-interaction.test.mjs tests/landscape-thuja-danica-original.test.mjs tests/landscape-lavender-original-glb.test.mjs
      - name: Commit real GLB and the generator to GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_boxwood_sempervirens.py assets/landscape-models/boxwood-sempervirens-forma-original.glb assets/landscape-models/boxwood-sempervirens-forma-original.source.json
          if git diff --cached --quiet; then echo 'Nothing new'; exit 0; fi
          git commit -m 'feat(boxwood): original three-form evergreen Buxus PBR GLB'
          git push origin HEAD:dom-render-nanobanana || (git pull --rebase origin dom-render-nanobanana && git push origin HEAD:dom-render-nanobanana)
