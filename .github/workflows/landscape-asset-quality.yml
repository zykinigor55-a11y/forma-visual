name: Landscape asset quality / genuine 2K build
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'assets/landscape/masters/**'
      - 'assets/landscape/items/**'
      - 'scripts/landscape_asset_quality.py'
      - 'forma-landscape-physical-details.js'
      - 'forma-landscape-catalog.js'
      - '.github/workflows/landscape-asset-quality.yml'
  pull_request:
    branches: [dom-render-nanobanana]
    paths:
      - 'assets/landscape/masters/**'
      - 'assets/landscape/items/**'
      - 'scripts/landscape_asset_quality.py'
      - 'forma-landscape-physical-details.js'
      - 'forma-landscape-catalog.js'
      - '.github/workflows/landscape-asset-quality.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  all-51-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'dom-render-nanobanana' || github.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image inspection tools
        run: python -m pip install --quiet Pillow
      - name: Audit every catalog item, transparency and native resolution
        run: python scripts/landscape_asset_quality.py --audit --report /tmp/landscape-quality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-51-quality-report
          path: /tmp/landscape-quality.json
          if-no-files-found: warn
      - name: Convert only approved true >=2K originals
        if: github.event_name == 'push' && github.ref == 'refs/heads/dom-render-nanobanana'
        run: python scripts/landscape_asset_quality.py --build-approved --report /tmp/landscape-built.json
      - name: Save verified native 2K masters to project
        if: github.event_name == 'push' && github.ref == 'refs/heads/dom-render-nanobanana'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- assets/landscape forma-landscape-hd.js
          if git diff --cached --quiet; then
            echo "No new approved masters. Low-quality originals were NOT falsely upscaled."
            exit 0
          fi
          git commit -m "Install approved native 2K landscape assets [skip ci]"
          git push origin HEAD:dom-render-nanobanana
