name: Build cohesive photo presets
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - '.github/workflows/build-preset-photos.yml'
      - 'scripts/build_preset_photos.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: python -m pip install --quiet Pillow
      - name: Generate local photographic previews
        run: python scripts/build_preset_photos.py
      - name: Commit photographic assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/thumbs/*.jpg
          if ! git diff --staged --quiet; then
            git commit -m 'Build cohesive nature-only photo thumbnails for presets'
            git push origin HEAD:dom-render-nanobanana
          fi
