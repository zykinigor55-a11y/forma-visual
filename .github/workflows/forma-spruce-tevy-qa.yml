name: FORMA · Norway spruce PBR A-B comparison
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'forma-mature-trees-preview.html'
      - 'tests/landscape-spruce-tevy-compare.verify.mjs'
      - 'assets/landscape-models/spruce-tevy-cc0.glb'
      - '.github/workflows/forma-spruce-tevy-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forma-spruce-a-b
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Compare real Norway spruce from matching 16m camera views
        run: |
          node server.mjs > /tmp/spruce-ab-server.log 2>&1 &
          sleep 3
          node tests/landscape-spruce-tevy-compare.verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-spruce-pbr-old-vs-tevy
          path: artifacts/landscape-editor/spruce-ab/*.png
          if-no-files-found: warn
