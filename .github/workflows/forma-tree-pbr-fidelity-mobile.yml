name: FORMA · Dense tree GLB fidelity on Android
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'forma-landscape-3d.html'
      - 'forma-landscape-3d-models.js'
      - 'tests/landscape-tree-pbr-fidelity-mobile.verify.mjs'
      - '.github/workflows/forma-tree-pbr-fidelity-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forma-tree-pbr-fidelity
  cancel-in-progress: true
jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Verify real GLB spruce stays unchanged after placing birch; broken assets never downgrade
        run: |
          node server.mjs >/tmp/forma-tree-pbr-qa.log 2>&1 &
          sleep 3
          node tests/landscape-tree-pbr-fidelity-mobile.verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-tree-fidelity-mobile
          path: artifacts/landscape-editor/trees-realism/*.png
          if-no-files-found: warn
