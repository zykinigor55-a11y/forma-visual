name: FORMA - seven refined user photo reference models v5
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - '.github/workflows/forma-luminaire-reference-v3.yml'
      - 'tools/capture_luminaires_v3.mjs'
      - 'forma-landscape-3d-luminaires-reference.js'
      - 'forma-landscape-3d-user-7-lights.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forma-luminaire-reference-v3
  cancel-in-progress: false
jobs:
  render-real-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify identities and dimensions
        run: node --test tests/landscape-3d-luminaire-models.test.mjs
      - name: Install Chromium WebGL
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start original DOM.RENDER Three.js server
        run: |
          PORT=3000 HOST=127.0.0.1 node server.mjs >/tmp/forma-luminaire-11.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS 'http://127.0.0.1:3000/forma-luminaire-01-render.html?id=bollard' >/dev/null && break
            sleep 1
          done
      - name: Render 11 authored fixture meshes
        run: node tools/capture_luminaires_v3.mjs
      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FORMA-7-refined-user-luminaires-v5
          if-no-files-found: warn
          path: |
            assets/landscape-screenshots/luminaire-v5-*-real-render.png
            assets/landscape-screenshots/luminaire-v5-photo-reference-proof.json
      - name: Save real renders on GitHub branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/landscape-screenshots/luminaire-v5-*-real-render.png assets/landscape-screenshots/luminaire-v5-photo-reference-proof.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'visual(luminaires): real WebGL captures of 11 product reference 3D models'
          git push origin HEAD:dom-render-nanobanana || (git pull --rebase origin dom-render-nanobanana && git push origin HEAD:dom-render-nanobanana)
