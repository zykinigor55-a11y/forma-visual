name: PLUX Android APK + iOS project
on:
  push:
    branches: [plux-v12-2-2k-fixes]
    paths:
      - 'mobile-plux/**'
      - '.github/workflows/plux-mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile-plux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PNG icon renderer
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK on hosted Ubuntu runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/platforms"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: |
          npx cap add android
          python3 scripts/patch-native.py android
          npx cap sync android
      - name: Compile APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PLUX-Android-debug-APK
          path: mobile-plux/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish permanent GitHub Android APK download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="plux-android-v28-20261110"
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          cp "$apk" "${RUNNER_TEMP}/PLUX-Android.apk"
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" "${RUNNER_TEMP}/PLUX-Android.apk" --clobber
          else
            gh release create "$version" "${RUNNER_TEMP}/PLUX-Android.apk" \
              --title "ПЛЮХ для Android — V28" \
              --notes "ПЛЮХ V28: исправлена серверная генерация PDF и GPT Image 2. Задачи работают независимо от мобильного HTTP-соединения; обновлены обработка ожидания, отображение статуса и восстановление результата после разрыва интернета. Требуется интернет для музыки и ИИ. Приложение использует работающий сервер Render для голосового помощника, чата и генераций. Для установки разрешите установку из браузера или файлового менеджера. Это тестовая сборка, не Google Play." \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
  ios:
    name: Prepare iOS Xcode project
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile-plux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PNG icon renderer
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate iOS platform
        run: |
          npx cap add ios
          python3 scripts/patch-native.py ios
          npx cap sync ios
      - name: Build unsigned iPhone IPA for AltStore Classic
        run: |
          set -euo pipefail
          cd ios
          xcodebuild -workspace App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          test -f build/Build/Products/Release-iphoneos/App.app/Info.plist
          mkdir -p altstore/Payload
          cp -a build/Build/Products/Release-iphoneos/App.app altstore/Payload/
          cd altstore
          ditto -c -k --sequesterRsrc --keepParent Payload PLUX-iPhone-AltStore.ipa
          test -s PLUX-iPhone-AltStore.ipa
      - name: Upload unsigned IPA for free Apple ID sideloading
        uses: actions/upload-artifact@v4
        with:
          name: PLUX-iPhone-AltStore-IPA
          path: mobile-plux/ios/altstore/PLUX-iPhone-AltStore.ipa
          if-no-files-found: error
      - name: Upload iOS project (signing required for iPhone)
        uses: actions/upload-artifact@v4
        with:
          name: PLUX-iOS-Xcode-project
          path: mobile-plux/ios/
          if-no-files-found: error
