name: PLUX Android APK + iOS project
on:
  push:
    branches: [plux-v12-2-2k-fixes]
    paths:
      - 'mobile-plux/**'
      - '.github/workflows/plux-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile-plux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Create Android project
        run: |
          npx cap add android
          python3 scripts/patch-native.py android
          npx cap sync android
      - name: Compile APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: PLUX-Android-debug-APK
          path: mobile-plux/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios:
    name: Prepare iOS Xcode project
    runs-on: macos-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile-plux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate iOS platform
        run: |
          npx cap add ios
          python3 scripts/patch-native.py ios
          npx cap sync ios
      - name: Upload iOS project (signing required for iPhone)
        uses: actions/upload-artifact@v4
        with:
          name: PLUX-iOS-Xcode-project
          path: mobile-plux/ios/
          if-no-files-found: error
