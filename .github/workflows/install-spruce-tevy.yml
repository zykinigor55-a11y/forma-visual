name: FORMA · Stage realistic Norway spruce GLB
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'tools/install-spruce-tevy.py'
      - '.github/workflows/install-spruce-tevy.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forma-stage-spruce-tevy
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned Tevy CC0 GLB and verify alpha needle textures
        run: python3 tools/install-spruce-tevy.py
      - name: Stage model safely without replacing existing spruce
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/landscape-models/spruce-tevy-cc0.glb assets/landscape-models/spruce-tevy-cc0.source.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(botany): stage CC0 Norway spruce with realistic alpha needle foliage"
          for attempt in 1 2 3 4 5; do
            git fetch origin dom-render-nanobanana
            git rebase origin/dom-render-nanobanana
            if git push origin HEAD:dom-render-nanobanana; then exit 0; fi
            sleep "$((attempt*2))"
          done
          exit 1
