name: PLUX V31.5 OLED permanent phone downloads
on:
  push:
    branches: [plux-v31-v30-base-friends-colors-music]
    paths:
      - '.github/workflows/plux-publish-v31-downloads.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    name: Publish direct APK and IPA download links
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Get verified PLUX V31 build files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/android artifacts/ios releases
          gh run download 43144756099 --repo "${{ github.repository }}" --name PLUX-v31-Android-debug-APK --dir artifacts/android
          gh run download 43144756099 --repo "${{ github.repository }}" --name PLUX-V31-iPhone-AltStore-IPA --dir artifacts/ios
          test -s artifacts/android/app-debug.apk
          test -s artifacts/ios/PLUX-V31-iPhone-AltStore.ipa
          cp artifacts/android/app-debug.apk releases/PLUX_V31_Android.apk
          cp artifacts/ios/PLUX-V31-iPhone-AltStore.ipa releases/PLUX_V31_iPhone_AltStore.ipa
          unzip -tq releases/PLUX_V31_Android.apk
          unzip -tq releases/PLUX_V31_iPhone_AltStore.ipa
          sha256sum releases/*
      - name: Publish permanent GitHub Release links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="plux-v31-20261112"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" releases/PLUX_V31_Android.apk releases/PLUX_V31_iPhone_AltStore.ipa --clobber --repo "${{ github.repository }}"
            gh release edit "$tag" --repo "${{ github.repository }}" --title "ПЛЮХ V31.5 OLED · Android и iPhone" --notes 'PLUX V31.5 OLED: истинный чёрный #000 для AMOLED/OLED, чёрные системные панели, восстановлена капля V30 (исправлен нулевой размер сцены), 3 стеклянные сферы клавиатуры/микрофона/камеры меняют цвет вместе с каплей, точные синий, красный, жёлтый; исходные металлические значки и Crystal Microdust сохранены. Также: шесть инструментов V30, Друзья, Audius и радио, контрастная подсветка главного экрана, ASMR-звук печати, центрированная Главная. Имя PLUX без номера. Android APK тестовой подписи, iOS IPA без подписи (AltStore).'
          else
            gh release create "$tag" releases/PLUX_V31_Android.apk releases/PLUX_V31_iPhone_AltStore.ipa --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "ПЛЮХ V31.5 OLED · Android и iPhone" --notes 'PLUX V31.5 OLED: истинный чёрный #000 для AMOLED/OLED, чёрные системные панели, восстановлена капля V30 (исправлен нулевой размер сцены), 3 стеклянные сферы клавиатуры/микрофона/камеры меняют цвет вместе с каплей, точные синий, красный, жёлтый; исходные металлические значки и Crystal Microdust сохранены. Также: шесть инструментов V30, Друзья, Audius и радио, контрастная подсветка главного экрана, ASMR-звук печати, центрированная Главная. Имя PLUX без номера. Android APK тестовой подписи, iOS IPA без подписи (AltStore).' --prerelease
          fi
          gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[] | (.name + " " + .url)'
