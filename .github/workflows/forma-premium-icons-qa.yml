name: FORMA · Premium left toolbar icons — Desktop/Phone QA
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'forma-premium-icons.js'
      - 'forma-landscape-3d.html'
      - 'tests/forma-premium-icons.test.mjs'
      - 'tests/forma-premium-icons-browser.verify.mjs'
      - '.github/workflows/forma-premium-icons-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forma-premium-left-tools
  cancel-in-progress: true
jobs:
  icons:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone SVG rendering and no external sprite dependencies
        run: node --test tests/forma-premium-icons.test.mjs
      - name: Install desktop browser
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Check all 14 icons and switching tools in Chromium
        run: |
          node server.mjs > /tmp/forma-tools.log 2>&1 &
          sleep 2
          node tests/forma-premium-icons-browser.verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-atelier-icon-desktop-mobile
          path: artifacts/landscape-editor/forma-atelier-icons-*.png
          if-no-files-found: warn
