name: FORMA · Native oak CC0 PBR GLB regression and WebGL
on:
  push:
    branches: [experiments/forma-oak-pbr-20261119, dom-render-nanobanana]
    paths:
      - 'forma-mature-trees-preview.html'
      - 'forma-landscape-3d-mature-trees.js'
      - 'forma-landscape-3d.html'
      - 'assets/landscape-models/oak-terraintale-cc0.glb'
      - 'tests/landscape-curated-adult-trees.test.mjs'
      - 'tests/landscape-oak-cc0-visual.verify.mjs'
      - 'tests/landscape-oak-editor-mobile.verify.mjs'
      - '.github/workflows/forma-oak-pbr-candidate-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forma-oak-cc0-webgl
  cancel-in-progress: true
jobs:
  oak:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate immutable local CC0 PBR glTF and provenance
        run: |
          python3 - <<'PY'
          import pathlib,struct,json,hashlib
          file=pathlib.Path('assets/landscape-models/oak-terraintale-cc0.glb')
          src=pathlib.Path('assets/landscape-models/oak-terraintale-cc0.source.json')
          b=file.read_bytes();info=json.loads(src.read_text())
          assert b[:4]==b'glTF' and struct.unpack_from('<I',b,4)[0]==2
          assert struct.unpack_from('<I',b,8)[0]==len(b)
          assert len(b)==664812
          digest=hashlib.sha256(b).hexdigest()
          assert digest=='6f2d4f60807f73fd24e0860b8e536d93aff2aecff79341122dffd89373627667'==info['sha256']
          assert info['license']=='CC0 1.0'
          print('VERIFIED OAK PBR',len(b),'bytes',digest)
          PY
      - name: Test full project and protect approved trees
        run: npm test
      - run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: PBR oak versus untextured Innerscene GLB (WebGL)
        run: |
          node server.mjs > /tmp/forma-oak-qa.log 2>&1 &
          sleep 3
          node tests/landscape-oak-cc0-visual.verify.mjs
          node tests/landscape-oak-editor-mobile.verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-oak-pbr-approved-review
          path: artifacts/landscape-editor/oak-pbr-compare/*
          if-no-files-found: warn
