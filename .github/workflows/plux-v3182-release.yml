name: PLUX V31.8.2 Android APK direct download
on:
  push:
    branches: [plux-v17-photo-chat-music-plan]
    paths: ['.github/workflows/plux-v3182-release.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Download tested Android 31.8.2 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts release
          gh run download 43222169861 --repo "${{ github.repository }}" --name PLUX-V31.8-Android-APK --dir artifacts
          test -s artifacts/app-debug.apk
          cp artifacts/app-debug.apk release/PLUX-V31.8.2-Android.apk
          unzip -tq release/PLUX-V31.8.2-Android.apk
          sha256sum release/PLUX-V31.8.2-Android.apk
      - name: Publish permanent GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="plux-v31-8-2-ai-voice-video-20261112"
          apk="release/PLUX-V31.8.2-Android.apk"
          notes="ПЛЮХ V31.8.2 debug APK. Основа 31.7, новая мини-анимация искусственного интеллекта вместо крупного стеклянного логотипа, усиленные частицы, 8 цветовых тем и смена цвета шариков/эквалайзера, Друзья с аватарками, Видео YouTube/RUTUBE/VK, запрос Android RECORD_AUDIO, улучшенная диагностика Nano Banana API Market. Интернет и доступный Render обязательны. Веб-генерация платная и зависит от API Market. Вариант для тестирования, не релиз магазина."
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber --repo "${{ github.repository }}"
            gh release edit "$tag" --repo "${{ github.repository }}" --title "PLUX V31.8.2 Android" --notes "$notes"
          else
            gh release create "$tag" "$apk" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "PLUX V31.8.2 Android" --notes "$notes" --prerelease
          fi
          gh release view "$tag" --repo "${{ github.repository }}" --json assets --jq '.assets[]|(.name+" "+.url)'
