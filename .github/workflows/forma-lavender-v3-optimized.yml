name: FORMA - optimized Lavender v3 GLB with preserved geometry
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - '.github/workflows/forma-lavender-v3-optimized.yml'
      - 'tools/generate_lavender_angustifolia.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forma-lavender-v3-optimized-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout DOM.RENDER landscape project
        uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          persist-credentials: true
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install reproducible original GLB generator packages
        run: python -m pip install --quiet 'numpy==2.3.5' 'trimesh==4.11.1' 'pillow==12.3.0'
      - name: Generate light PBR Lavender with same leaf and flower distribution
        run: python tools/generate_lavender_angustifolia.py assets/landscape-models/lavender-angustifolia-forma-original.glb assets/landscape-models/lavender-angustifolia-forma-original.source.json
      - name: Verify optimized binary, true scale and complete botanical details
        run: |
          python - <<'PY'
          import json,hashlib,struct,re
          from pathlib import Path
          output=Path('assets/landscape-models/lavender-angustifolia-forma-original.glb')
          binary=output.read_bytes()
          meta=json.loads(Path('assets/landscape-models/lavender-angustifolia-forma-original.source.json').read_text())
          digest=hashlib.sha256(binary).hexdigest()
          assert binary[:4]==b'glTF' and struct.unpack_from('<I',binary,4)[0]==2
          assert struct.unpack_from('<I',binary,8)[0]==len(binary)
          assert digest==meta['sha256']=='d8ad111821ddaae2508a4ef40e0386ab83b0529b2ba4ca8fe67af2bf3bd301d1',digest
          assert len(binary)==11173924 and meta['triangles']==444419
          assert meta['meshCount']==39 and meta['materialCount']==13
          assert len(binary)<20365776*0.60
          assert meta['triangles']<621874*0.75
          expected={
            'LAVENDER_NATURAL':((.88,.63,.87),197,420,1480,150653),
            'LAVENDER_COMPACT':((.70,.47,.69),122,294,1010,98928),
            'LAVENDER_MATURE':((1.12,.77,1.09),254,540,1870,194838)
          }
          for name,(dim,stems,branches,tufts,tri) in expected.items():
            f=meta['forms'][name]
            assert tuple(f[x] for x in ('width','height','depth'))==dim
            assert (f['flowerStems'],f['foliageStems'],f['foliageTufts'],f['triangles'])==(stems,branches,tufts,tri)
          header_length=struct.unpack_from('<I',binary,12)[0]
          gltf=json.loads(binary[20:20+header_length])
          names={n.get('name') for n in gltf['nodes']}
          assert set(expected).issubset(names)
          assert all('TEXCOORD_0' not in prim.get('attributes',{}) for mesh in gltf['meshes'] for prim in mesh['primitives'])
          registry=Path('forma-landscape-3d-shrub-models.js')
          source=registry.read_text()
          begin=source.index(' lavender:Object.freeze({')
          end=source.index('\n }),',begin)
          old=source[begin:end]
          new,n=re.subn(r"sha256:'[0-9a-f]{64}'",f"sha256:'{digest}'",old)
          assert n==1
          new=re.sub("fidelity:'[^']*'",
            "fidelity:'FORMA original v3 mobile-optimized PBR Lavender; three true-scale variants, all 573 flower stems and 4360 foliage tufts retained, 444419 triangles total, UV-free vertex payload and original botanical geometry'",
            new)
          registry.write_text(source[:begin]+new+source[end:])
          print('Lavender v3 verified',len(binary),'bytes,',meta['triangles'],'triangles, SHA',digest)
          PY
      - name: Run native GLB three-form and editor regression tests
        run: |
          node --test tests/landscape-lavender-original-glb.test.mjs tests/landscape-shrub-editor-interaction.test.mjs tests/landscape-thuja-danica-original.test.mjs
      - name: Commit optimizer GLB and registry to actual GitHub project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_lavender_angustifolia.py assets/landscape-models/lavender-angustifolia-forma-original.glb assets/landscape-models/lavender-angustifolia-forma-original.source.json forma-landscape-3d-shrub-models.js
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'perf(lavender): cut GLB bytes 45 percent and triangles 29 percent, preserve original forms'
          git push origin HEAD:dom-render-nanobanana || (git pull --rebase origin dom-render-nanobanana && git push origin HEAD:dom-render-nanobanana)
