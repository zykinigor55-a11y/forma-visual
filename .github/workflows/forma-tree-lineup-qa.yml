name: FORMA · Real 3D trees lined up — visual proof
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'forma-tree-lineup.html'
      - 'tests/forma-3d-tree-lineup.verify.mjs'
      - '.github/workflows/forma-tree-lineup-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forma-tree-lineup-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lineup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser without unavailable Ubuntu apt mirror
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Render row of ten native GLB trees and save comparison shots
        run: |
          node server.mjs > /tmp/forma-lineup-server.log 2>&1 &
          sleep 3
          node tests/forma-3d-tree-lineup.verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FORMA-real-3d-trees-in-one-row
          path: artifacts/landscape-editor/tree-lineup/*.png
          if-no-files-found: warn
