name: FORMA - download free CC0 winter dogwood reference
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - '.github/workflows/forma-download-dogwood-winter-reference.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          persist-credentials: true
      - name: Download directly from original CC0 publisher and verify GLB
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib,struct,json,pathlib
          target=pathlib.Path('assets/landscape-models/dogwood-red-stemmed-3dassets-cc0.glb')
          meta=pathlib.Path('assets/landscape-models/dogwood-red-stemmed-3dassets-cc0.source.json')
          info=json.loads(meta.read_text())
          url=info['directDownload']
          request=urllib.request.Request(url,headers={'User-Agent':'FORMA-Visual-CC0-asset-fetch/1.0','Accept':'model/gltf-binary,application/octet-stream,*/*'})
          with urllib.request.urlopen(request,timeout=70) as response:
            payload=response.read(2500000)
            final_url=response.geturl()
          if len(payload)<30000 or len(payload)>1800000:
            raise RuntimeError('Untrusted file size: '+str(len(payload)))
          if payload[:4]!=b'glTF' or struct.unpack_from('<II',payload,4)!=(2,len(payload)):
            raise RuntimeError('Invalid glTF 2.0 binary header')
          n=struct.unpack_from('<I',payload,12)[0]
          if payload[16:20]!=b'JSON':raise RuntimeError('Missing glTF JSON chunk')
          gltf=json.loads(payload[20:20+n].decode('utf8'))
          if not gltf.get('meshes') or not gltf.get('materials'):raise RuntimeError('Empty model')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(payload)
          info.update(status='downloaded, GLB v2 header and JSON validated',sha256=hashlib.sha256(payload).hexdigest(),sizeBytes=len(payload),meshCount=len(gltf['meshes']),materialCount=len(gltf['materials']),resolvedUrl=final_url)
          meta.write_text(json.dumps(info,ensure_ascii=False,indent=2)+'\n')
          print('Verified model',len(payload),'bytes',info['sha256'],'meshes',len(gltf['meshes']))
          PY
      - name: Save reference to GitHub without changing active shrubs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'assets/landscape-models/dogwood-red-stemmed-3dassets-cc0.glb' 'assets/landscape-models/dogwood-red-stemmed-3dassets-cc0.source.json'
          if ! git diff --cached --quiet; then
            git commit -m 'assets(dogwood): save verified original CC0 red twig winter GLB as reference only'
            git push origin HEAD:dom-render-nanobanana
          fi
