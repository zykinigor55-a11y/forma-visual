name: Publish Neiro Studiya
on:
  push:
    branches: [neiro-studiya]
    paths:
      - 'neiro-studiya/web/**'
      - 'neiro-studiya/tools/build_2k_cards.py'
      - '.github/workflows/deploy-neiro-studiya.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: neiro-studiya-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site and video
        run: |
          test -s neiro-studiya/web/index.html
          test -s neiro-studiya/web/site.js
          test -s neiro-studiya/web/styles.css
          test -s neiro-studiya/web/assets/neiro-studiya-v14.mp4
      - name: Prepare 2K studio imagery
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          python neiro-studiya/tools/build_2k_cards.py
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          assets=Path('neiro-studiya/web/assets')
          names=['hero-mobius.webp','service-apps.webp','service-photogrammetry.webp',
            'service-architecture.webp','service-film.webp','service-cgi.webp',
            'service-worlds.webp','project-achron.webp','project-dome.webp',
            'project-gods.webp','about-cyborg.webp']
          for name in names:
            with Image.open(assets/name) as im:
              assert im.size == (2048,1152), (name,im.size)
          print("11/11 premium card images passed 2K size check")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: neiro-studiya/web
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v4
