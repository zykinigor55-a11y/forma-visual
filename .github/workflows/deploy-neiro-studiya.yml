name: Publish Neiro Studiya
on:
  push:
    branches: [neiro-studiya]
    paths:
      - 'neiro-studiya/web/**'
      - 'neiro-studiya/tools/build_2k_cards.py'
      - '.github/workflows/deploy-neiro-studiya.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: neiro-studiya-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site and video
        run: |
          test -s neiro-studiya/web/index.html
          test -s neiro-studiya/web/site.js
          test -s neiro-studiya/web/styles.css
          test -s neiro-studiya/web/assets/neiro-studiya-v14.mp4
      - name: Prepare original or supplied 2K gallery artwork
        run: |
          python -m pip install --disable-pip-version-check "Pillow>=11,<13"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from PIL import Image
          from io import BytesIO
          import sys

          root=Path("neiro-studiya/web")
          archive=root/"assets-update.zip"
          names=["hero-mobius.webp","service-apps.webp","service-photogrammetry.webp",
            "service-architecture.webp","service-film.webp","service-cgi.webp",
            "service-worlds.webp","project-achron.webp","project-dome.webp",
            "project-gods.webp","about-cyborg.webp"]
          if archive.exists():
              staged=[]
              if archive.stat().st_size > 25000000:
                  raise ValueError("The update ZIP is larger than 25 MB")
              with ZipFile(archive) as z:
                  for name in names:
                      data=z.read("assets/"+name)
                      if not 1000 < len(data) < 5000000:
                          raise ValueError("Invalid image length: "+name)
                      with Image.open(BytesIO(data)) as image:
                          if image.size!=(2048,1152) or image.format!="WEBP":
                              raise ValueError("Expected WebP 2048x1152: "+name)
                      staged.append((root/"assets"/name,data))
              for dest,data in staged:
                  dest.write_bytes(data)
              print("Applied 11 approved new gallery images from assets-update.zip")
              archive.unlink()  # Exclude the upload archive from the public Pages artifact.
          else:
              # Retain approved native asset pixels: re-encoding every deploy
              # would unnecessarily alter and degrade the V21 artwork.
              valid=True
              for name in names:
                  path=root/"assets"/name
                  try:
                      with Image.open(path) as image:
                          if image.size!=(2048,1152) or image.format!="WEBP":
                              valid=False
                  except (FileNotFoundError, OSError):
                      valid=False
              if valid:
                  print("Using 11 committed V21 2K WebP images unchanged")
              else:
                  import subprocess
                  subprocess.run([sys.executable,"neiro-studiya/tools/build_2k_cards.py"],check=True)
                  print("Fallback: regenerated missing or old gallery artwork")
          for name in names:
              with Image.open(root/"assets"/name) as image:
                  assert image.size==(2048,1152) and image.format=="WEBP",name
          print("11/11 premium gallery cards passed 2K size and WebP checks")
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: neiro-studiya/web
      # Artifact upload can finish before the Pages API lists the artifact.
      - name: Allow Pages artifact metadata to propagate
        run: sleep 18
      - name: Deploy site
        id: deploy
        uses: actions/deploy-pages@v4
