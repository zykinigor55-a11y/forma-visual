name: FORMA · rebuild original Elegantissima GLB v5

on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'tools/dogwood-elegantissima-v5.py.xz.b64'
      - '.github/workflows/forma-dogwood-rebuild-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forma-dogwood-v5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout FORMA editor branch
        uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mesh generator dependencies
        run: python -m pip install --quiet 'numpy>=2,<3' 'trimesh>=4.11,<5' 'pillow>=12,<13'
      - name: Decode original source and generate real 3-crown GLB
        run: |
          base64 --decode tools/dogwood-elegantissima-v5.py.xz.b64 | xz --decompress > tools/generate_dogwood_elegantissima.py
          python tools/generate_dogwood_elegantissima.py assets/landscape-models/dogwood-elegantissima-forma-original.glb /tmp/forma-dogwood-v5-info.json
      - name: Update asset provenance and verification metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          info=json.loads(Path('/tmp/forma-dogwood-v5-info.json').read_text())
          srcp=Path('assets/landscape-models/dogwood-elegantissima-forma-original.source.json')
          src=json.loads(srcp.read_text(encoding='utf-8'))
          src.update({
            'sourceCode':'tools/generate_dogwood_elegantissima.py',
            'license':'Original FORMA-authored geometry and PBR texture, no purchased assets',
            'reference':'Original independently-generated summer Cornus alba Elegantissima',
            'status':'original verified GLB; locally rendered v5; deployment pending',
            'version':info['version'],
            'sha256':info['sha256'],
            'sizeBytes':info['sizeBytes'],
            'triangles':info['triangles'],
            'meshCount':info['meshCount'],
            'materialCount':info['materialCount'],
            'textureCount':info['textureCount'],
            'leafCounts':{k:v['leaves'] for k,v in info['stats'].items()},
          })
          srcp.write_text(json.dumps(src,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          refp=Path('assets/landscape-models/dogwood-elegantissima-selected-summer.reference.json')
          ref=json.loads(refp.read_text(encoding='utf-8'))
          ref['status']='Original FORMA v5 three-form GLB committed to 3D editor source; production deployment not yet confirmed'
          custom=ref.setdefault('customImplementation',{})
          custom.update({'modelPath':str(src['modelPath']),'generator':src['sourceCode'],
            'status':'v5 geometry rebuilt from source and tested',
            'sha256':info['sha256'],'license':'original FORMA-generated 3D content'})
          refp.write_text(json.dumps(ref,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          p=Path('tests/landscape-dogwood-three-shapes.test.mjs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('assert.equal(src.triangles,320508);',
             'assert.ok(src.triangles >= 250000,\'dense botanical geometry\');')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify GLB and integrated three-form editor
        run: node --test tests/landscape-dogwood-three-shapes.test.mjs
      - name: Commit complete working assets back to the DOM.RENDER branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/generate_dogwood_elegantissima.py assets/landscape-models/dogwood-elegantissima-forma-original.glb assets/landscape-models/dogwood-elegantissima-forma-original.source.json assets/landscape-models/dogwood-elegantissima-selected-summer.reference.json tests/landscape-dogwood-three-shapes.test.mjs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "feat(dogwood): replace broom shrub with dense cream-variegated v5 GLB crowns"
          git push origin HEAD:dom-render-nanobanana || (git pull --rebase origin dom-render-nanobanana && git push origin HEAD:dom-render-nanobanana)
