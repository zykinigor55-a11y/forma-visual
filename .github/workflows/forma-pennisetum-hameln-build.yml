name: FORMA - replace ninebark with original fluffy Hameln grass GLB
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'tools/pennisetum-hameln-original-generator.py.xz.b64'
      - '.github/workflows/forma-pennisetum-hameln-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forma-pennisetum-hameln-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout original FORMA DOM.RENDER codebase
        uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          persist-credentials: true
      - name: Set up reproducible Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original botanical modeling dependencies
        run: python -m pip install --quiet 'numpy==2.3.5' 'trimesh==4.11.1' 'pillow==12.3.0'
      - name: Recover original source model generator
        run: |
          base64 --decode tools/pennisetum-hameln-original-generator.py.xz.b64 | xz --decompress > tools/generate_pennisetum_hameln.py
          python -m py_compile tools/generate_pennisetum_hameln.py
      - name: Build three fountain grass and fluffy inflorescence models into actual GLB
        run: |
          python tools/generate_pennisetum_hameln.py assets/landscape-models/pennisetum-hameln-forma-original.glb assets/landscape-models/pennisetum-hameln-forma-original.source.json
      - name: Verify source integrity, physically meshed grass and correct shape hierarchy
        run: |
          python - <<'PY'
          import json,hashlib,struct
          from pathlib import Path
          p=Path('assets/landscape-models/pennisetum-hameln-forma-original.glb')
          b=p.read_bytes()
          src=json.loads(Path('assets/landscape-models/pennisetum-hameln-forma-original.source.json').read_text())
          digest=hashlib.sha256(b).hexdigest()
          assert b[:4]==b'glTF' and struct.unpack_from('<I',b,4)[0]==2
          assert struct.unpack_from('<I',b,8)[0]==len(b)
          assert digest==src['sha256']=='15991fd8e7a7944def689dac5db0389fd1b6365aad30c1f99c50dd2454a644b9',(digest,src['sha256'])
          assert src['sizeBytes']==7021132
          assert src['triangleCount']==195876 and src['meshCount']==36
          import re
          reg=Path('forma-landscape-3d-shrub-models.js').read_text()
          assert digest in reg and ' pennisetum:Object.freeze({' in reg
          gltf=json.loads(b[20:20+struct.unpack_from('<I',b,12)[0]])
          assert len(gltf['materials'])==12
          names={node.get('name') for node in gltf['nodes']}
          for kind in ['PENNISETUM_NATURAL','PENNISETUM_COMPACT','PENNISETUM_MATURE']:
            assert kind in names and kind+'-plume-cream' in names and kind+'-foliage-green' in names
            assert src['forms'][kind]['plumeBristles']>18000
          print('Real Hameln 3D verified:',len(b),'bytes,',src['triangleCount'],'triangles')
          PY
      - name: Run shrub compatibility and migration tests
        run: |
          node --test tests/landscape-pennisetum-hameln-original.test.mjs tests/landscape-shrub-editor-interaction.test.mjs tests/landscape-thuja-danica-original.test.mjs
      - name: Save real GLB and source to project branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_pennisetum_hameln.py assets/landscape-models/pennisetum-hameln-forma-original.glb assets/landscape-models/pennisetum-hameln-forma-original.source.json
          if git diff --cached --quiet; then echo 'No new assets'; exit 0; fi
          git commit -m 'feat(pennisetum): replace ninebark with three fluffy original fountain grass GLBs'
          git push origin HEAD:dom-render-nanobanana || (git pull --rebase origin dom-render-nanobanana && git push origin HEAD:dom-render-nanobanana)
