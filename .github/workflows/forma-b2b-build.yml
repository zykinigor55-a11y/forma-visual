name: FORMA B2B - Build check
on:
  push:
    paths:
      - 'b2b/**'
      - '.github/workflows/forma-b2b-build.yml'
  pull_request:
    paths:
      - 'b2b/**'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: b2b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - name: Screenshots of working UI
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-b2b-visual-smoke
          path: b2b/e2e-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q b2b/import-service
