name: FORMA - rebuild and verify Elegantissima v9 PBR model
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'tools/dogwood-elegantissima-v9.patch.xz.b64'
      - '.github/workflows/forma-dogwood-rebuild-v9.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forma-dogwood-v9-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the active landscape editor
        uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install GLB procedural generator dependencies
        run: python -m pip install --quiet 'numpy>=2,<3' 'trimesh>=4.11,<5' 'pillow>=12,<13'
      - name: Apply audited original v9 procedural changes
        run: |
          base64 --decode tools/dogwood-elegantissima-v9.patch.xz.b64 | xz --decompress > /tmp/forma-dogwood-v9.patch
          patch tools/generate_dogwood_elegantissima.py < /tmp/forma-dogwood-v9.patch
      - name: Rebuild v9 native 3-shape textured GLB
        run: |
          python tools/generate_dogwood_elegantissima.py assets/landscape-models/dogwood-elegantissima-forma-original.glb /tmp/dogwood-v9-info.json
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          info=json.loads(Path('/tmp/dogwood-v9-info.json').read_text())
          blob=Path('assets/landscape-models/dogwood-elegantissima-forma-original.glb').read_bytes()
          assert blob[:4]==b'glTF'
          assert info['sha256']==hashlib.sha256(blob).hexdigest()
          assert info['sha256']=='7eca9000e3473b36303bc8d18b720bdf3ec05323c33a6a54abe48225b15a13a8'
          assert info['triangles']==397670
          assert info['meshCount']==24 and info['materialCount']==8
          assert info['stats']['DOGWOOD_NATURAL']['leaves']>=14000
          assert 12000000 < len(blob) < 16500000
          print('FORMA dogwood v9 GLB checked',info['sha256'])
          PY
      - name: Update botanical metadata and JS GLB integrity manifest
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          info=json.loads(Path('/tmp/dogwood-v9-info.json').read_text())
          p=Path('assets/landscape-models/dogwood-elegantissima-forma-original.source.json')
          src=json.loads(p.read_text(encoding='utf-8'))
          src.update({
            'sourceCode':'tools/generate_dogwood_elegantissima.py',
            'reference':'Independently authored Cornus alba Elegantissima, botanical photographs only',
            'status':'Original v9 generated and verified, 3 native crown shapes',
            'version':info['version'],'sha256':info['sha256'],
            'sizeBytes':info['sizeBytes'],'triangles':info['triangles'],
            'meshCount':info['meshCount'],'materialCount':info['materialCount'],
            'textureCount':info['textureCount'],
            'leafCounts':{k:v['leaves'] for k,v in info['stats'].items()}
          })
          p.write_text(json.dumps(src,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          p=Path('assets/landscape-models/dogwood-elegantissima-selected-summer.reference.json')
          ref=json.loads(p.read_text(encoding='utf-8'))
          ref['status']='Original FORMA v9 GLB saved in the editor source and tested; Render deployment not yet confirmed'
          impl=ref.setdefault('customImplementation',{})
          impl.update({'modelPath':src['modelPath'],'generator':src['sourceCode'],
            'sha256':info['sha256'],'status':'v9 generated, verified and committed'})
          p.write_text(json.dumps(ref,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          p=Path('forma-landscape-3d-shrub-models.js')
          js=p.read_text(encoding='utf-8')
          match=re.search(r'dogwood:Object.freeze\(\{.*?\n \}\)',js,re.S)
          if not match: raise Exception('Dogwood registry missing')
          block=match.group()
          updated,n=re.subn(r"sha256:'[0-9a-f]{64}'",f"sha256:'{info['sha256']}'",block)
          if n!=1: raise Exception('Dogwood hash field not unique')
          updated=re.sub(r"fidelity:'[^']*'", "fidelity:'self-authored v9, cream-edged opposite leaves, 3D petioles, darker interior leaves, upright mature canes and three independently modelled PBR crowns'",updated)
          js=js[:match.start()]+updated+js[match.end():]
          p.write_text(js,encoding='utf-8')
          PY
      - name: Verify native geometry, three editor variants and interaction
        run: |
          node --test tests/landscape-dogwood-three-shapes.test.mjs tests/landscape-shrub-editor-interaction.test.mjs
      - name: Save v9 GLB and registration in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/generate_dogwood_elegantissima.py assets/landscape-models/dogwood-elegantissima-forma-original.glb assets/landscape-models/dogwood-elegantissima-forma-original.source.json assets/landscape-models/dogwood-elegantissima-selected-summer.reference.json forma-landscape-3d-shrub-models.js
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m "feat(dogwood): refined v9 Elegantissima, native three GLB crown variants and cream foliage"
          git push origin HEAD:dom-render-nanobanana || (git pull --rebase origin dom-render-nanobanana && git push origin HEAD:dom-render-nanobanana)
