name: FORMA - build own three-variant dogwood Elegantissima GLB
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'tools/generate_dogwood_elegantissima.py'
      - '.github/workflows/forma-dogwood-original-glb.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deterministic dependencies
        run: python -m pip install 'numpy==2.3.5' 'trimesh==4.11.1' 'Pillow==12.3.0'
      - name: Generate and validate independently authored dogwood
        run: |
          python 'tools/generate_dogwood_elegantissima.py' 'assets/landscape-models/dogwood-elegantissima-forma-original.glb'
          python - <<'PY'
          import hashlib,json,struct,pathlib
          file=pathlib.Path('assets/landscape-models/dogwood-elegantissima-forma-original.glb')
          data=file.read_bytes()
          assert data[:4]==b'glTF' and struct.unpack_from('<II',data,4)==(2,len(data))
          n=struct.unpack_from('<I',data,12)[0]
          gltf=json.loads(data[20:20+n])
          assert {'DOGWOOD_NATURAL','DOGWOOD_SPHERE','DOGWOOD_BOX'}<={v.get('name') for v in gltf['nodes']}
          count=sum(gltf['accessors'][p['indices']]['count']//3 for m in gltf['meshes'] for p in m['primitives'])
          assert count>160000 and len(gltf['meshes'])>=21
          source=pathlib.Path('assets/landscape-models/dogwood-elegantissima-forma-original.source.json')
          meta=json.loads(source.read_text())
          meta.update(status='original verified GLB',sha256=hashlib.sha256(data).hexdigest(),sizeBytes=len(data),triangles=count,meshCount=len(gltf['meshes']),materialCount=len(gltf['materials']),textureCount=len(gltf.get('textures',[])))
          source.write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n')
          print('Verified new dogwood',len(data),count,'triangles')
          PY
      - name: Commit binary and provenance without replacing any existing trees
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'assets/landscape-models/dogwood-elegantissima-forma-original.glb' 'assets/landscape-models/dogwood-elegantissima-forma-original.source.json'
          if ! git diff --cached --quiet; then
            git commit -m 'assets(dogwood): add original PBR Elegantissima with three real silhouette options'
            git push origin HEAD:dom-render-nanobanana
          fi
