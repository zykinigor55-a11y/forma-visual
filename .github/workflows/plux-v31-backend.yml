name: PLUX V31 backend compatibility
on:
  push:
    branches: [pluh-v31-v30-compatible-preview]
    paths:
      - 'pluh-voice-server/**'
      - '.github/workflows/plux-v31-backend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: pluh-voice-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate V30 and V31 with offline mocked API calls
        run: npm install --no-audit --no-fund
      - name: Confirm V30 features kept
        run: |
          test -s image-download-v30.mjs
          test -s generation-jobs-v28.mjs
          test -s chat-stream-v29.mjs
          test -s music-audius-v24.mjs
          test -s music-radio-v31.mjs
