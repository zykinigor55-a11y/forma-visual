name: Build SCENA Android APK
on:
  workflow_dispatch:
  push:
    branches: [scena-cloud-20261112]
    paths:
      - 'scena_app/**'
      - '.github/workflows/scena-build-apk.yml'
jobs:
  apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Installing Android command-line tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            unzip -qo /tmp/android-tools.zip -d /tmp/android-unpacked
            cp -a /tmp/android-unpacked/cmdline-tools/. "$SDK_ROOT/cmdline-tools/latest/"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug APK
        working-directory: scena_app/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK output
        run: test -s scena_app/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SCENA-Android-v1.4-debug-apk
          path: scena_app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
