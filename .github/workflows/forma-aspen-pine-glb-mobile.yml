name: FORMA · Real GLB pine and aspen on Android
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'forma-landscape-3d.html'
      - 'forma-landscape-3d-models.js'
      - 'forma-landscape-3d-mature-trees.js'
      - 'forma-landscape-pine-native.js'
      - 'tests/landscape-aspen-pine-mobile-glb.verify.mjs'
      - '.github/workflows/forma-aspen-pine-glb-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forma-android-aspen-pine-glb
  cancel-in-progress: true
jobs:
  mobile-webgl:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile WebGL Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Load both CC0 trees and verify no replacement on 430px phone
        run: |
          node server.mjs > /tmp/forma-aspen-pine-server.log 2>&1 &
          sleep 3
          node tests/landscape-aspen-pine-mobile-glb.verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-aspen-pine-android-glb-preview
          path: artifacts/landscape-editor/glb-aspen-pine/*.png
          if-no-files-found: warn
