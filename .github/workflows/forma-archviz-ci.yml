name: FORMA ARCHVIZ · checks
on:
  push:
    branches:
      - feature/forma-archviz-studio
  pull_request:
    branches:
      - dom-render-nanobanana

jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check app.js
          node --check server.mjs
          node --check forma-archviz-studio.js
          node --check forma-interiors.js
          node --check forma-nodes.js
          node --check forma-node-engine.js
          node --check forma-pro-tools.js
          node --check forma-home-tools.js
          node --check forma-world.js
      - name: Unit and contract tests
        run: node --test tests/*.test.mjs
