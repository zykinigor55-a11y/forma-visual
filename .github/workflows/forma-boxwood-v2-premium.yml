name: FORMA · Premium Buxus v2 botanical model and QA

on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'tools/boxwood-sempervirens-v2.py.xz.b64'
      - '.github/workflows/forma-boxwood-v2-premium.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forma-boxwood-v2-premium-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild-test-save:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out original FORMA VISUAL DOM.RENDER
        uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible botanical generator dependencies
        run: python -m pip install --quiet 'numpy==2.3.5' 'trimesh==4.11.1' 'pillow==12.3.0'
      - name: Restore verified original high detail generator
        run: |
          base64 --decode tools/boxwood-sempervirens-v2.py.xz.b64 | xz --decompress > tools/generate_boxwood_sempervirens.py
          python -m py_compile tools/generate_boxwood_sempervirens.py
      - name: Build three independently authored true-scale Buxus crowns
        run: |
          python tools/generate_boxwood_sempervirens.py assets/landscape-models/boxwood-sempervirens-forma-original.glb assets/landscape-models/boxwood-sempervirens-forma-original.source.json
      - name: Verify exact real GLB and update existing THREE.js registry
        run: |
          python - <<'PY'
          import hashlib,struct,json,re
          from pathlib import Path
          path=Path('assets/landscape-models/boxwood-sempervirens-forma-original.glb')
          data=path.read_bytes()
          doc=json.loads(Path('assets/landscape-models/boxwood-sempervirens-forma-original.source.json').read_text())
          sha=hashlib.sha256(data).hexdigest()
          assert data[:4]==b'glTF'
          assert struct.unpack_from('<I',data,4)[0]==2
          assert struct.unpack_from('<I',data,8)[0]==len(data)
          expected='1d199528b759bb250879613a734fbc2d08c53f8dc4b2c38abb513a5b17ab88ce'
          assert sha==doc['sha256']==expected,(sha,doc['sha256'])
          assert doc['version']=='v2.0-premium-botanical-foliage'
          assert doc['sizeBytes']==18386388
          assert doc['triangles']==720940 and doc['meshCount']==30 and doc['materialCount']==10
          counts=[doc['forms'][k]['leafCount'] for k in ('BOXWOOD_NATURAL','BOXWOOD_SPHERE','BOXWOOD_HEDGE')]
          assert counts==[26500,17800,45000],counts
          header=struct.unpack_from('<I',data,12)[0]
          gltf=json.loads(data[20:20+header])
          names={n.get('name') for n in gltf['nodes']}
          for form in doc['forms']:
              assert form in names
              assert form+'-leaf-green' in names
              assert form+'-leaf-shadow' in names
              assert form+'-wood' in names
          # Match the corresponding live 3D asset loader's content integrity entry.
          registry=Path('forma-landscape-3d-shrub-models.js')
          text=registry.read_text(encoding='utf-8')
          start=text.index(' boxwood:Object.freeze({')
          stop=text.index('\n }),',start)
          old=text[start:stop]
          new,n=re.subn(r"sha256:'[0-9a-f]{64}'",f"sha256:'{sha}'",old)
          assert n==1
          new=re.sub("fidelity:'[^']*'","fidelity:'Premium original Buxus v2: curved thick oval leaf geometry, 8 leaf tone materials, decussate twig pairs, dense lower canopy, uniform perimeter-sampled hedge wall foliage and three original true-scale crowns; 720940 triangles combined'",new)
          registry.write_text(text[:start]+new+text[stop:],encoding='utf-8')
          print('Buxus v2 PASS',sha,len(data),'bytes',counts,'leaves')
          PY
      - name: Run real GLB and shrub editor regression tests
        run: |
          node --test tests/landscape-boxwood-original-glb.test.mjs tests/landscape-shrub-editor-interaction.test.mjs tests/landscape-thuja-danica-original.test.mjs tests/landscape-lavender-original-glb.test.mjs
      - name: Commit original tested botanical asset and source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/generate_boxwood_sempervirens.py assets/landscape-models/boxwood-sempervirens-forma-original.glb assets/landscape-models/boxwood-sempervirens-forma-original.source.json forma-landscape-3d-shrub-models.js
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'feat(boxwood): premium Buxus v2 3D foliage and densely clipped hedge'
          git push origin HEAD:dom-render-nanobanana || (git pull --rebase origin dom-render-nanobanana && git push origin HEAD:dom-render-nanobanana)
