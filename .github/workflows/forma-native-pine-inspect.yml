name: FORMA · Native pine GLB diagnostics
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'tools/inspect-native-pine.mjs'
      - '.github/workflows/forma-native-pine-inspect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/inspect-native-pine.mjs
