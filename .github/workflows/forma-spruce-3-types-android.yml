name: FORMA · Spruce 3 stages + birch + Android graphite
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'forma-landscape-3d.html'
      - 'forma-landscape-3d-models.js'
      - 'forma-landscape-spruce-native.js'
      - 'forma-landscape-spruce-growth.js'
      - 'forma-graphite-unified-v2.css'
      - 'forma-graphite-only-v3.css'
      - 'tests/landscape-spruce-three-stages-mobile.verify.mjs'
      - '.github/workflows/forma-spruce-3-types-android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forma-spruce-3-types-phone
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Real 430px touch select, spruce age/type and birch PBR
        run: |
          node server.mjs >/tmp/forma-spruce-three-mobile-server.log 2>&1 &
          sleep 3
          node tests/landscape-spruce-three-stages-mobile.verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-android-three-spruces-and-birch-graphite
          path: artifacts/landscape-editor/spruce-phone/*.png
          if-no-files-found: warn
