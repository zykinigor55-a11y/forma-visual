name: PLUX 31.8.8 live chat network diagnostics
on:
  push:
    branches: [plux-v3188-chat-network-recovery]
    paths: ['plux-v31/probe-chat-network-v3188.mjs','.github/workflows/plux-v3188-network.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Probe Render API reachability, OPTIONS, CORS and error JSON (no paid request)
        run: node plux-v31/probe-chat-network-v3188.mjs
