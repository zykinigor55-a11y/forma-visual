name: FORMA R200 transparent horizon assets
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'scripts/prepare-panorama-r200.py'
      - '.github/workflows/forma-panorama-r200.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow numpy opencv-python-headless
      - run: python scripts/prepare-panorama-r200.py
      - name: Save optimized local textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/panoramas/r200
          if ! git diff --cached --quiet; then
            git commit -m "R200 install transparent hill and mountain PNGs"
            git pull --rebase origin dom-render-nanobanana
            git push origin HEAD:dom-render-nanobanana
          fi
