name: FORMA · Silver birch refined native PBR visual QA
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'forma-landscape-birch-native.js'
      - 'forma-landscape-3d-models.js'
      - 'forma-mature-trees-preview.html'
      - 'tests/landscape-birch-airy-visual.verify.mjs'
      - '.github/workflows/forma-birch-airy-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forma-birch-refined-qa
  cancel-in-progress: true
jobs:
  birch:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Preview native birch front, diagonal, back and Android size
        run: |
          node server.mjs > /tmp/forma-birch-airy-qa.log 2>&1 &
          sleep 3
          node tests/landscape-birch-airy-visual.verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-birch-pbr-refined-4views
          path: artifacts/landscape-editor/birch-airy-approved/*.png
          if-no-files-found: warn
