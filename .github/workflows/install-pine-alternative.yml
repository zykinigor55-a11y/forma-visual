name: FORMA · Evaluate alternative mature CC0 pine
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - '.github/workflows/install-pine-alternative.yml'
      - 'tools/install-pine-alternative.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forma-stage-pine-alternative
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and audit the original publisher CC0 GLB
        run: python3 tools/install-pine-alternative.py
      - name: Commit only the staged, verified alternate GLB and provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/landscape-models/pine-mature-innerscene-cc0.glb assets/landscape-models/pine-mature-innerscene-cc0.source.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(botany): stage independent CC0 adult Scots pine for visual A/B"
          for attempt in 1 2 3 4 5; do
            git fetch origin dom-render-nanobanana
            git rebase origin/dom-render-nanobanana
            if git push origin HEAD:dom-render-nanobanana; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
