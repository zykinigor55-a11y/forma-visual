name: FORMA R197 transparent horizon assets
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'scripts/prepare-panorama-r197.py'
      - '.github/workflows/forma-panorama-r197.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python scripts/prepare-panorama-r197.py
      - name: Save optimized local textures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/panoramas/r197
          if ! git diff --cached --quiet; then
            git commit -m "R197 install ambientCG CC0 transparent forest textures"
            git pull --rebase origin dom-render-nanobanana
            git push origin HEAD:dom-render-nanobanana
          fi
