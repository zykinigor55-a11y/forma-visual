name: FORMA - v5 seven photo reference lamps inside actual 3D editor
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - '.github/workflows/forma-luminaires-real-screenshot.yml'
      - 'tools/capture_luminaires_real_editor.mjs'
      - 'forma-landscape-3d-fixtures.js'
      - 'forma-landscape-3d-user-7-lights.js'
      - 'forma-landscape-3d-lighting.js'
      - 'forma-landscape-3d.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forma-luminaires-real-screenshot
  cancel-in-progress: false
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test luminaire physics and identities
        run: node --test tests/landscape-3d-luminaire-models.test.mjs
      - name: Install real Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start the real 3D editor
        run: |
          PORT=3000 HOST=127.0.0.1 node server.mjs > /tmp/forma-lights.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS http://127.0.0.1:3000/forma-landscape-3d.html >/dev/null && break
            sleep 1
          done
      - name: Capture actual editor screen and its WebGL canvas
        run: node tools/capture_luminaires_real_editor.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FORMA-real-11-luminaires-WebGL-night
          if-no-files-found: warn
          path: |
            assets/landscape-screenshots/lighting-v5-user-7-editor-night.png
            assets/landscape-screenshots/lighting-v5-user-7-webgl-night.png
            assets/landscape-screenshots/lighting-v5-user-7-editor-proof.json
      - name: Commit real screenshots back to DOM.RENDER branch
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/landscape-screenshots/lighting-v5-user-7-editor-night.png assets/landscape-screenshots/lighting-v5-user-7-webgl-night.png assets/landscape-screenshots/lighting-v5-user-7-editor-proof.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'visual(luminaires): real WebGL scene and editor screenshot'
          git push origin HEAD:dom-render-nanobanana || (git pull --rebase origin dom-render-nanobanana && git push origin HEAD:dom-render-nanobanana)
