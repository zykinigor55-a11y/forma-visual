name: FORMA · Maple and ash botanical PBR / WebGL fidelity
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'forma-landscape-ash-leaves.js'
      - 'forma-landscape-3d-vegetation.js'
      - 'forma-landscape-3d-botany.js'
      - 'forma-landscape-3d-photo-foliage.js'
      - 'tests/landscape-maple-ash-visual.verify.mjs'
      - 'tests/landscape-maple-ash-morphology.test.mjs'
      - '.github/workflows/forma-maple-ash-fidelity.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forma-maple-ash-webgl-qa
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Real species geometry and preservation tests
        run: node --test tests/landscape-maple-ash-morphology.test.mjs
      - name: Maple original CC0 GLB and ash native foliage in WebGL
        run: |
          node server.mjs > /tmp/forma-maple-ash-webgl.log 2>&1 &
          sleep 3
          node tests/landscape-maple-ash-visual.verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-maple-ash-3d-realism-screens
          path: artifacts/landscape-editor/maple-ash/*.png
          if-no-files-found: warn
