name: FORMA - opal globe real translucency and night ground light
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - '.github/workflows/forma-globe-night-optics.yml'
      - 'tools/capture_opal_globe_night.mjs'
      - 'forma-landscape-globe-optics.js'
      - 'forma-landscape-3d-lighting.js'
      - 'forma-landscape-3d-user-7-lights.js'
      - 'forma-luminaire-01-render.html'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forma-globe-night-optics-v6
  cancel-in-progress: false
jobs:
  webgl-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify optical and dimmer unit tests
        run: node --test tests/landscape-3d-luminaire-models.test.mjs
      - name: Install real WebGL Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Start original garden editor assets server
        run: |
          PORT=3000 HOST=127.0.0.1 node server.mjs >/tmp/forma-globe.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS 'http://127.0.0.1:3000/forma-luminaire-01-render.html?id=globe&mode=night' >/dev/null; then break; fi
            sleep 1
          done
      - name: Prove sphere glows and illuminates real geometry
        run: node tools/capture_opal_globe_night.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FORMA-opal-sphere-night-on-off-ground-light-webgl
          if-no-files-found: warn
          path: |
            assets/landscape-screenshots/lighting-v6-*-actual-WebGL.png
            assets/landscape-screenshots/lighting-v6-globe-night-optics-proof.json
      - name: Commit verified real WebGL proof images
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/landscape-screenshots/lighting-v6-*-actual-WebGL.png assets/landscape-screenshots/lighting-v6-globe-night-optics-proof.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'visual(globe): real translucent sphere night-on-off ground emission evidence'
          git push origin HEAD:dom-render-nanobanana || (git pull --rebase origin dom-render-nanobanana && git push origin HEAD:dom-render-nanobanana)
