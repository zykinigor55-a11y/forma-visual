name: FORMA - Thuja Danica v4 native PBR model
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'tools/thuja-danica-v4.py.xz.b64'
      - '.github/workflows/forma-thuja-danica-v4.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forma-thuja-v4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout active FORMA editor branch
        uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install procedural geometry dependencies
        run: python -m pip install --quiet 'numpy==2.3.5' 'trimesh==4.11.1' 'pillow==12.3.0'
      - name: Restore original v4 generator
        run: |
          base64 --decode tools/thuja-danica-v4.py.xz.b64 | xz --decompress > tools/generate_thuja_danica.py
          python -m py_compile tools/generate_thuja_danica.py
      - name: Build original 3-form v4 GLB
        run: |
          python tools/generate_thuja_danica.py assets/landscape-models/thuja-danica-forma-original.glb assets/landscape-models/thuja-danica-forma-original.source.json
      - name: Verify GLB, real crown geometries and edit model manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,json,struct,hashlib
          path=Path('assets/landscape-models/thuja-danica-forma-original.glb')
          blob=path.read_bytes()
          doc=json.loads(Path('assets/landscape-models/thuja-danica-forma-original.source.json').read_text())
          actual=hashlib.sha256(blob).hexdigest()
          expected='dddcf23ad26608d9ee6a917d1d40378a9223e6683203b2cefc1ce266fc9822ce'
          assert blob[:4]==b'glTF' and struct.unpack_from('<I',blob,8)[0]==len(blob)
          assert actual==expected==doc['sha256'], (actual,doc['sha256'])
          assert doc['triangles']==213694 and doc['meshCount']==27
          glen=struct.unpack_from('<I',blob,12)[0]
          gltf=json.loads(blob[20:20+glen])
          names={x.get('name') for x in gltf['nodes']}
          for variant in ['THUJA_DANICA_NATURAL','THUJA_DANICA_COMPACT','THUJA_DANICA_MATURE']:
              assert variant in names
              assert variant+'-green' in names
              assert variant+'-wood' in names
          assert sum(m.get('alphaMode')=='MASK' for m in gltf['materials'])==7
          assert len(gltf['images'])==7
          print('Verified original Danica v4:',path.stat().st_size,'bytes',doc['triangles'],'triangles')
          registry=Path('forma-landscape-3d-shrub-models.js')
          text=registry.read_text()
          start=text.index(" 'thuja-globe':Object.freeze({")
          stop=text.index("\n }),",start)
          block=text[start:stop]
          updated,n=re.subn("sha256:'[0-9a-f]{64}'","sha256:'"+actual+"'",block)
          assert n==1
          updated=re.sub("fidelity:'[^']*'","fidelity:'FORMA original v4; 3 separate true-scale crowns with nested flat fan sprays, physical woody stems and 7 independently painted alpha-masked PBR needle atlases'",updated)
          registry.write_text(text[:start]+updated+text[stop:])
          PY
      - name: Run targeted real-asset and editing tests
        run: |
          node --test tests/landscape-thuja-danica-original.test.mjs tests/landscape-shrub-editor-interaction.test.mjs tests/landscape-dogwood-three-shapes.test.mjs
      - name: Commit tested model, source and integrity manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/generate_thuja_danica.py assets/landscape-models/thuja-danica-forma-original.glb assets/landscape-models/thuja-danica-forma-original.source.json forma-landscape-3d-shrub-models.js
          if git diff --cached --quiet; then echo 'Already up to date'; exit 0; fi
          git commit -m "feat(thuja): sculpted v4 Danica PBR sprays and three true-scale GLB crowns"
          git push origin HEAD:dom-render-nanobanana || (git pull --rebase origin dom-render-nanobanana && git push origin HEAD:dom-render-nanobanana)
