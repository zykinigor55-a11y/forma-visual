name: FORMA landscape editor interaction checks
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'forma-landscape-project*'
      - 'forma-landscape-3d*'
      - 'tests/landscape-3d-browser.verify.mjs'
      - 'tests/landscape-editor.verify.mjs'
      - 'tests/landscape-workflow.verify.mjs'
      - 'forma-landscape-brush.js'
      - 'forma-landscape-pdf.js'
      - '.github/workflows/landscape-editor-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: |
          node server.mjs > /tmp/forma-server.log 2>&1 &
          node tests/landscape-editor.verify.mjs
          node tests/landscape-workflow.verify.mjs
          node tests/landscape-3d-browser.verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-editor-desktop-mobile
          path: artifacts/landscape-editor
