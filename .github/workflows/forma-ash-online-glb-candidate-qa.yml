name: FORMA · Internet CC0 ash GLB candidate visual inspection
on:
  push:
    branches: [experiments/forma-ash-real-glb-webgl-20261119]
    paths:
      - 'forma-ash-online-preview.html'
      - 'tests/landscape-ash-online-model-qa.verify.mjs'
      - '.github/workflows/forma-ash-online-glb-candidate-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forma-online-ash-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve CC0 source without replacing production tree
        run: |
          mkdir -p assets/landscape-models
          curl -fLsS --retry 3 --connect-timeout 18 --max-time 90 \
            'https://terraintale.com/library/realistic-surfaces/ash_tree_large.glb' \
            -o assets/landscape-models/ash-terraintale-cc0.glb
          python3 - <<'PY'
          import struct,hashlib,pathlib,json
          path=pathlib.Path('assets/landscape-models/ash-terraintale-cc0.glb')
          raw=path.read_bytes()
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,4)[0]==2
          assert struct.unpack_from('<I',raw,8)[0]==len(raw), 'complete GLB required'
          n=struct.unpack_from('<I',raw,12)[0]
          data=json.loads(raw[20:20+n].decode('utf-8'))
          summary=dict(size=len(raw),sha256=hashlib.sha256(raw).hexdigest(),
            meshes=len(data.get('meshes',[])),materials=len(data.get('materials',[])),
            images=len(data.get('images',[])),textures=len(data.get('textures',[])))
          print('FREE SOURCE GLB',summary)
          assert summary['sha256']=='e2f6c99b9a46e3b4ba40ff8efd4f734dc02511023feb9eb85492a6260f0f4e17', 'source changed since visual QA, refuse commit'
          PY
      - name: Keep verified CC0 binary in isolated evaluation branch
        run: |
          git config user.name "FORMA botanical QA"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/landscape-models/ash-terraintale-cc0.glb
          git commit -m "asset(ash): add SHA-verified CC0 textured mature Fraxinus GLB" || exit 0
          git push origin HEAD:refs/heads/experiments/forma-ash-real-glb-webgl-20261119
      - run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Render close-range bark and mature Fraxinus crown
        run: |
          node server.mjs > /tmp/forma-ash-candidate.log 2>&1 &
          sleep 3
          node tests/landscape-ash-online-model-qa.verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-ash-free-glb-source-review
          path: artifacts/landscape-editor/ash-online-cc0/*
          if-no-files-found: warn
