name: FORMA · Native textured ash CC0 WebGL quality
on:
  push:
    branches: [dom-render-nanobanana, experiments/forma-ash-real-glb-webgl-20261119]
    paths:
      - 'forma-ash-online-preview.html'
      - 'forma-landscape-3d.html'
      - 'forma-landscape-3d-mature-trees.js'
      - 'assets/landscape-models/ash-terraintale-cc0.glb'
      - 'tests/landscape-ash-online-model-qa.verify.mjs'
      - 'tests/landscape-ash-editor-mobile.verify.mjs'
      - 'tests/landscape-curated-adult-trees.test.mjs'
      - '.github/workflows/forma-ash-online-glb-candidate-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forma-mature-ash-webgl
  cancel-in-progress: true
jobs:
  ash:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify local source and CC0 signed-off checksum
        run: |
          python3 - <<'PY'
          import hashlib,json,struct,pathlib
          asset=pathlib.Path('assets/landscape-models/ash-terraintale-cc0.glb').read_bytes()
          provenance=json.loads(pathlib.Path('assets/landscape-models/ash-terraintale-cc0.source.json').read_text())
          assert asset[:4]==b'glTF' and struct.unpack_from('<I',asset,4)[0]==2
          assert struct.unpack_from('<I',asset,8)[0]==len(asset)
          assert hashlib.sha256(asset).hexdigest()=='e2f6c99b9a46e3b4ba40ff8efd4f734dc02511023feb9eb85492a6260f0f4e17'==provenance['sha256']
          assert provenance['license']=='CC0 1.0'
          print('LOCAL GLB OK',len(asset),'bytes, SHA-256',provenance['sha256'])
          PY
      - run: |
          npm install --no-save playwright@1.56.0
          npx playwright install chromium
      - name: Full native tree catalogue and winter fallbacks
        run: node --test tests/landscape-curated-adult-trees.test.mjs tests/landscape-maple-ash-morphology.test.mjs
      - name: Render actual GLB bark closeup, crown and mobile
        run: |
          node server.mjs > /tmp/forma-mature-ash.log 2>&1 &
          sleep 3
          node tests/landscape-ash-online-model-qa.verify.mjs
          node tests/landscape-ash-editor-mobile.verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-mature-ash-pbr-real-glb
          path: artifacts/landscape-editor/ash-online-cc0/*
          if-no-files-found: warn
