name: FORMA · Install verified adult CC0 trees
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - '.github/workflows/install-mature-trees.yml'
      - 'tools/install-mature-trees.py'
      - 'assets/landscape-models/mature-trees.sources.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forma-install-mature-cc0-trees
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve source binaries and validate embedded PBR models
        run: python3 tools/install-mature-trees.py
      - name: Validate catalogue, import support and existing pine
        run: node --test tests/landscape-curated-adult-trees.test.mjs tests/landscape-real-glb.test.mjs tests/landscape-mature-scots-pine-asset.test.mjs
      - name: Commit only validated CC0 assets with attribution records
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/landscape-models/{birch,spruce,oak}-mature-cc0.glb assets/landscape-models/{birch,spruce,oak}-mature-cc0.source.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "assets(botany): add audited adult CC0 birch spruce oak GLBs"
          for i in 1 2 3 4 5; do
            git fetch origin dom-render-nanobanana
            git rebase origin/dom-render-nanobanana
            if git push origin HEAD:dom-render-nanobanana; then exit 0; fi
            sleep "$((i * 2))"
          done
          exit 1
