name: FORMA — regenerate 1080 top-down premium assets
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - 'tools/generate-landscape-premium.py'
      - '.github/workflows/build-landscape-premium.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline raster tools
        run: python -m pip install --quiet pillow numpy
      - name: Generate 46 square 1080×1080 PNG assets
        run: python tools/generate-landscape-premium.py
      - name: Verify complete asset set
        run: |
          test "$(find assets/landscape-premium -maxdepth 1 -name '*.png' | wc -l)" -eq 46
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files=list(Path('assets/landscape-premium').glob('*.png'))
          for f in files:
              im=Image.open(f)
              assert im.size==(1080,1080),(f,im.size)
              assert im.format=='PNG',(f,im.format)
              if f.stem in {'pine','spruce','birch','oak','maple','linden','willow','rowan','apple','sakura','juniper','hydrangea','spirea','barberry','dogwood','thuja-globe','lavender','boxwood'}:
                  assert im.mode=='RGBA' and im.getpixel((0,0))[3]==0,(f,'missing alpha')
          print('Verified',len(files),'1080x1080 top-down assets.')
          PY
      - name: Commit finished assets to project branch
        run: |
          git config user.name 'FORМA Design Bot'
          git config user.email 'forma-design-bot@users.noreply.github.com'
          git add assets/landscape-premium
          if ! git diff --cached --quiet; then
            git commit -m "assets(FORMA): publish 46 native square PNG landscape cards with CC0 lawn photography"
            git fetch origin dom-render-nanobanana
            git rebase origin/dom-render-nanobanana
            git push origin HEAD:dom-render-nanobanana
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-landscape-premium-1080
          path: |
            assets/landscape-premium/_contact-sheet.jpg
            assets/landscape-premium/*.png
          if-no-files-found: warn
