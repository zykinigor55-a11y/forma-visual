name: FORMA · Install CC0 mature Scots pine
on:
  push:
    branches: [dom-render-nanobanana]
    paths:
      - '.github/workflows/install-mature-scots-pine.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dom-render-nanobanana
      - name: Download and inspect permissively licensed adult Scots pine GLBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/forma-pines assets/landscape-models
          curl -fLsS --retry 2 --connect-timeout 12 --max-time 75 -A 'FORMA-asset-installer/1.0'             'https://www.innerscene.com/api/library/mature-scots-pine-tree-280307e1/download'             -o /tmp/forma-pines/innerscene.glb || true
          curl -fLsS --retry 2 --connect-timeout 12 --max-time 75 -A 'FORMA-asset-installer/1.0'             'https://tevy.dev/models/scots-pine/v1/lod0.glb'             -o /tmp/forma-pines/tevy.glb || true
          python3 - <<'PY'
          import json,struct,pathlib,hashlib,datetime,shutil
          files={
            'innerscene': ('https://www.innerscene.com/tools/library/3d-parts/mature-scots-pine-tree-280307e1','https://www.innerscene.com/api/library/mature-scots-pine-tree-280307e1/download'),
            'tevy': ('https://tevy.dev/models/scots-pine','https://tevy.dev/models/scots-pine/v1/lod0.glb')
          }
          options=[]
          for slug,(page,url) in files.items():
            p=pathlib.Path('/tmp/forma-pines/'+slug+'.glb')
            try:
              data=p.read_bytes()
              if len(data)<50000 or len(data)>28000000: raise ValueError('Suspicious GLB size')
              magic,version,length=struct.unpack_from('<4sII',data,0)
              if magic!=b'glTF' or version!=2 or length!=len(data):raise ValueError('GLB header malformed')
              size,typ=struct.unpack_from('<I4s',data,12)
              if typ!=b'JSON':raise ValueError('No GLB JSON chunk')
              scene=json.loads(data[20:20+size])
              meshes=scene.get('meshes',[]);materials=scene.get('materials',[])
              tris=0
              for mesh in meshes:
                for primitive in mesh.get('primitives',[]):
                  accessor=scene['accessors'][primitive.get('indices',primitive.get('attributes',{}).get('POSITION',0))]
                  tris+=accessor.get('count',0)//3
              mats=len(materials)
              images=len(scene.get('images',[]))
              alpha=sum(m.get('alphaMode','OPAQUE')!='OPAQUE' for m in materials)
              textured=sum(bool(m.get('pbrMetallicRoughness',{}).get('baseColorTexture')) for m in materials)
              info={'source':slug,'sizeBytes':len(data),'meshCount':len(meshes),'triangles':tris,'materials':mats,'images':images,'transparentMaterials':alpha,'texturedMaterials':textured}
              print('CANDIDATE',json.dumps(info))
              if not meshes or tris<100 or mats<1:raise ValueError('Too little geometry')
              # External textures would break on Render; packed images are mandatory.
              if images:
                if any('uri' in im and not im['uri'].startswith('data:') for im in scene['images']):raise ValueError('External image links not allowed')
              if tris>800000:raise ValueError('Too heavy for mobile')
              # More needle/shading information, not raw mesh count, is critical.
              score=images*12+textured*9+alpha*8+min(tris,180000)/20000 - len(data)/12000000
              options.append((score,slug,p,page,url,info))
            except Exception as e: print('REJECT',slug,str(e))
          if not options:raise SystemExit('No valid adult Scots pine GLB, deployment unchanged')
          options.sort(reverse=True)
          score,slug,p,page,url,info=options[0]
          target=pathlib.Path('assets/landscape-models/pine-mature-cc0.glb')
          shutil.copyfile(p,target)
          license_data={
           'name':'Mature Scots pine (Pinus sylvestris)','origin':slug,
           'sourcePage':page,'sourceDownload':url,'license':'CC0 1.0',
           'licenseUrl':'https://creativecommons.org/publicdomain/zero/1.0/',
           'integratedBy':'FORMA VISUAL','retrievedUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
           'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
           'analysis':info,'selectionScore':round(score,3),
           'note':'Original CC0 source. Kept locally for no external model network dependency.'
          }
          target.with_suffix('.source.json').write_text(json.dumps(license_data,ensure_ascii=False,indent=2)+'\n')
          print('SELECTED',json.dumps(license_data))
          PY
      - name: Commit checked CC0 binary and provenance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/landscape-models/pine-mature-cc0.glb assets/landscape-models/pine-mature-cc0.source.json
          if ! git diff --cached --quiet; then
            git commit -m "assets(botany): install validated CC0 adult Scots pine GLB with real needle and bark materials"
            git push origin HEAD:dom-render-nanobanana
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forma-mature-scots-pine-source
          path: |
            assets/landscape-models/pine-mature-cc0.source.json
          if-no-files-found: ignore
