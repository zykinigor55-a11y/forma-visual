services:
  - type: web
    name: dom-render-nanobanana
    env: node
    plan: free
    buildCommand: echo 'No build step required'
    startCommand: node server.mjs
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: HOST
        value: 0.0.0.0
      - key: API_MARKET_KEY
        sync: false
      - key: DAILY_GENERATION_LIMIT
        value: '12'
