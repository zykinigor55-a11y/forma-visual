<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101213">
<meta name="description" content="KATYA KNIT — нить ставшая искусством. Авторское текстильное искусство. Откройте галерею картин.">
<title>KATYA KNIT — Нить ставшая искусством</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Prata&display=swap" rel="stylesheet">
<link rel="preload" href="assets/hero-poster.webp" as="image">
<link rel="stylesheet" href="assets/video-only.css">
</head>
<body>
<main class="video-stage" aria-label="KATYA KNIT — видео и вход в галерею">
  <video class="hero-video" autoplay muted loop playsinline preload="metadata" poster="assets/hero-poster.webp" aria-hidden="true">
    <source src="assets/hero-mobile-final-loop.mp4" type="video/mp4" media="(max-width: 700px)">
    <source src="assets/hero-living-canvas.mp4" type="video/mp4">
  </video>
  <div class="video-shade" aria-hidden="true"></div>
  <header class="masthead">
    <a class="brand" href="index.html" aria-label="KATYA KNIT — главная">
      <img src="assets/brand-ring-monochrome.svg" width="52" height="52" alt="" class="brand-sign">
      <span class="brand-copy"><strong>KATYA KNIT</strong><small>НИТЬ СТАВШАЯ ИСКУССТВОМ</small></span>
    </a>
  </header>
  <div class="gallery-entry">
    <span class="entry-meta">KATYA KNIT / TEXTILE ART</span>
    <a class="gallery-button" href="catalog.html" aria-label="Открыть галерею картин KATYA KNIT">
      <span><small>СМОТРЕТЬ КОЛЛЕКЦИЮ</small><strong>ГАЛЕРЕЯ</strong></span>
      <span class="gallery-arrow" aria-hidden="true">↗</span>
    </a>
  </div>
</main>
<script>
document.addEventListener('visibilitychange',()=>{const v=document.querySelector('.hero-video');if(document.hidden)v.pause();else if(!matchMedia('(prefers-reduced-motion: reduce)').matches)v.play().catch(()=>{});});
</script>
</body>
</html>
