<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOM.RENDER · Фотореалистичные 3D-валуны</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#424648}canvas{display:block;width:100vw;height:100vh}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {ROCK_SCAN_SOURCES,createPhotogrammetryBoulder} from './forma-landscape-3d-rocks.js';
const id=new URLSearchParams(location.search).get('id')||'granite-boulder';
if(!ROCK_SCAN_SOURCES[id])throw Error('Invalid boulder type');
const width=innerWidth,height=innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});
renderer.setSize(width,height);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.17;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#32383b');
const env=new THREE.PMREMGenerator(renderer);
scene.environment=env.fromScene(new RoomEnvironment(),.04).texture;
scene.environmentIntensity=.70;
scene.add(new THREE.HemisphereLight(0xe5ebf0,0x51524c,1.05));
const key=new THREE.DirectionalLight(0xffe8cf,3.5);
key.position.set(-3.5,6,5);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
key.shadow.camera.near=.1;key.shadow.camera.far=22;
key.shadow.camera.left=-4;key.shadow.camera.right=4;
key.shadow.camera.top=4;key.shadow.camera.bottom=-4;
key.shadow.bias=-.0002;key.shadow.normalBias=.012;
key.shadow.radius=4;scene.add(key);
const fill=new THREE.DirectionalLight(0xb5d4ed,1.18);fill.position.set(3,3,-3);scene.add(fill);
const accent=new THREE.DirectionalLight(0xf4f6ef,.75);accent.position.set(1,2,4);scene.add(accent);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(25,25),
 new THREE.MeshStandardMaterial({color:'#414747',roughness:.94,metalness:0}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.015;
ground.receiveShadow=true;scene.add(ground);
const materialId=id;
const original=await new GLTFLoader().loadAsync('/'+ROCK_SCAN_SOURCES[id]);
const sizes={'granite-boulder':[1.5,.90],'limestone-boulder':[1.6,.78],
 'slate-boulder':[1.7,.62],'sandstone-boulder':[1.8,.89]};
const [diameter,heightMetres]=sizes[id];
const instance={id:'boulder-preview-'+id,type:'boulders',catalogId:id,
 x:8,y:9,diameter,height:heightMetres,variant:1,burial:.11,rotation:0};
const boulder=createPhotogrammetryBoulder(THREE,original.scene,instance);
if(!boulder)throw Error('No valid photogrammetry rock');
scene.add(boulder);
const bbox=new THREE.Box3().setFromObject(boulder);
const center=bbox.getCenter(new THREE.Vector3());
const bounds=bbox.getSize(new THREE.Vector3());
const camera=new THREE.PerspectiveCamera(31,width/height,.03,100);
const extent=Math.max(bounds.x,bounds.y*1.35,bounds.z);
const distance=extent/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))*1.28;
const dir=new THREE.Vector3(1.1,.63,1.5).normalize();
camera.position.copy(center).addScaledVector(dir,distance);
camera.lookAt(center.x,Math.max(.24,center.y),center.z);
renderer.render(scene,camera);
window.FORMA_BOULDER_READY=true;
window.FORMA_BOULDER_PROOF={
  id,scanSource:ROCK_SCAN_SOURCES[id],
  modelVersion:boulder.userData.modelVersion,
  scanStats:boulder.userData.scanStats,
  geometryBounds:bounds.toArray(),
  center:center.toArray(),diameter,
  renderer:'Three.js original WebGL',webgl:!!renderer.getContext()
};
</script></body></html>
