<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORMA · Проверка взрослых GLB-деревьев</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#dce3da;color:#26342c;font:14px system-ui}
canvas{width:100%;height:100%;display:block}
aside{position:absolute;top:15px;left:15px;max-width:290px;padding:12px 16px;line-height:1.5;
 background:#172922ec;border:1px solid #647c6a;border-radius:12px;color:#f4eee2}
small{color:#c0cfc3}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<link rel="stylesheet" href="forma-graphite-unified-v2.css?v=graphite-universal-20261119">
<link rel="stylesheet" href="forma-graphite-only-v3.css?v=graphite-only-20261119-v3">
</head><body><canvas id="canvas"></canvas><aside><strong id="species">FORMA · ДЕРЕВЬЯ CC0</strong>
<div id="state">Подготовка GLB...</div><small>Взрослые 3D-модели · обзор с разных ракурсов</small></aside>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {KTX2Loader} from 'three/addons/loaders/KTX2Loader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {makeRealVegetation} from './forma-landscape-3d-models.js';
import {MATURE_TREE_MODELS} from './forma-landscape-3d-mature-trees.js';

const name=new URL(location.href).searchParams.get('species')||'birch';
const candidate=new URL(location.href).searchParams.get('candidate');
const showOldSpruce=name==='spruce'&&candidate==='old';
const showOldBirch=name==='birch'&&candidate==='old';
const showTerrainOak=name==='oak'&&candidate==='terraintale';
const showOriginalOak=name==='oak'&&candidate==='innerscene';
const showOriginalBirch=name==='birch'&&candidate==='original';
const showSoftBirch=name==='birch'&&candidate==='soft';
const asset=showOldBirch?{...MATURE_TREE_MODELS.birch,name:'Берёза · старая GLB для сравнения',path:MATURE_TREE_MODELS.birch.fallbackPath}:
 showOldSpruce?{...MATURE_TREE_MODELS.spruce,name:'Ель · прежняя редкая GLB',path:MATURE_TREE_MODELS.spruce.fallbackPath}:
 showOriginalOak?{...MATURE_TREE_MODELS.oak,name:'Дуб · прежняя Innerscene GLB',path:MATURE_TREE_MODELS.oak.fallbackPath}:
 showTerrainOak?{...MATURE_TREE_MODELS.oak,name:'Дуб · TerrainTale · новый PBR'}:MATURE_TREE_MODELS[name];
const details=document.querySelector('#state');
const sizes={birch:[14,8],spruce:[16,9],oak:[8.6,7.8],maple:[9.5,7.1],linden:[8.8,7.1],beech:[20,14],sakura:[6,7.4],apple:[5.13,5.88],aspen:[15.61,7.61],rowan:[8.1,6.95]};
const canvas=document.querySelector('#canvas');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color('#d9e0d7');
scene.add(new THREE.HemisphereLight('#e8f4ff','#9e977d',1.7));
const sun=new THREE.DirectionalLight('#fff0d8',3);
sun.position.set(-18,28,17);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=25;sun.shadow.camera.bottom=-18;
sun.shadow.normalBias=.02;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(50,50),new THREE.MeshStandardMaterial({color:'#83977d',roughness:.99}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const camera=new THREE.PerspectiveCamera(34,1,.1,150);
function view(yaw=0,elev=.18){
 const w=Math.max(320,innerWidth),h=Math.max(360,innerHeight);
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
 const height=sizes[name]?.[0]||14,dist=Math.max(22,height*2.2);
 camera.position.set(Math.sin(yaw)*dist,height*.49+Math.sin(elev)*dist,Math.cos(yaw)*dist);
 camera.lookAt(0,height*.49,0);renderer.render(scene,camera);
}
window.__treeView=view;
window.__oakBarkView=(yaw=.55)=>{
 const w=Math.max(320,innerWidth),h=Math.max(360,innerHeight);
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
 camera.position.set(Math.sin(yaw)*5.8,3.4,Math.cos(yaw)*5.8);
 camera.lookAt(0,2.5,0);renderer.render(scene,camera);
};
window.addEventListener('resize',()=>view());
try{
 if(!asset)throw Error('Неизвестный вид дерева');
 document.querySelector('#species').textContent='FORMA · '+asset.name;
 const ktx2=new KTX2Loader().setTranscoderPath('/assets/three-basis/').setWorkerLimit(2);
 ktx2.detectSupport(renderer);
 const gltf=await new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder).loadAsync(asset.path);
 ktx2.dispose();
 const tree=makeRealVegetation(THREE,gltf.scene,{catalogId:name,height:sizes[name][0],diameter:sizes[name][1]},{shareGeometry:true,birchRefinement:showSoftBirch?'soft':'original'});
 scene.add(tree);
 const box=new THREE.Box3().setFromObject(tree),size=box.getSize(new THREE.Vector3());
 let meshes=0,materials=0,textures=0,alphas=0;
 tree.traverse(obj=>{if(!obj.isMesh)return;meshes++;
  for(const m of (Array.isArray(obj.material)?obj.material:[obj.material])){
   if(!m)continue;materials++;if(m.map)textures++;if(m.alphaTest||m.transparent)alphas++;
  }});
 window.__treeDetails={name,height:size.y,diameter:Math.max(size.x,size.z),meshes,materials,textures,alphas,candidate:name==='oak'?(showOriginalOak?'innerscene':'terraintale'):name==='birch'?(showOldBirch?'old':showSoftBirch?'soft':showOriginalBirch?'original':'tevy'):name==='spruce'?(showOldSpruce?'old':'tevy'):'current'};
 details.textContent='Загружено · '+meshes+' мешей · '+textures+' текстурных материалов';
 window.__treeReady=true;view();
}catch(error){window.__treeError=String(error);details.textContent='Ошибка: '+error.message;}
</script></body></html>
