<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORMA WebGPU Engine</title><style>html,body{margin:0;height:100%;background:#15191b;color:#eee;font:13px system-ui}main{height:100%;display:grid;place-items:center;overflow:hidden}canvas{width:100%;height:100%;object-fit:contain;display:block}#panel{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:min(460px,92vw);box-sizing:border-box;padding:15px;background:#22282df5;border:1px solid #738279;border-radius:12px;box-shadow:0 12px 40px #0006}button{background:#34453c;color:white;border:1px solid #768b7c;border-radius:8px;padding:10px 14px;cursor:pointer}button:disabled{opacity:.4}progress{width:100%;height:7px;accent-color:#91b8a2}#msg{margin:8px 0;overflow-wrap:anywhere}small{color:#bec9c1}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/webgpu":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.webgpu.js","three/tsl":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.tsl.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/","three/examples/jsm/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/","three-mesh-bvh":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.10.0/src/index.js","three-mesh-bvh/webgpu":"https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.10.0/src/webgpu/index.js"}}</script></head><body><main id="view"></main><section id="panel"><strong style="font-size:17px">FORMA · WebGPU Engine <small>EXPERIMENTAL R162</small></strong><div id="msg">Загрузка вычислительного движка…</div><progress id="progress" max="1" value="0"></progress><p><small id="stats">Независимый движок · без подмены WebGL</small></p><div style="display:flex;gap:8px"><button id="close">В редактор</button><button id="save" disabled>Сохранить PNG</button></div></section><script type="module">
const $=id=>document.getElementById(id),msg=$('msg'),bar=$('progress'),save=$('save');let renderer,pt,raf=0,dead=false,frame=0,saveRequested=false,settings,loadedScene;
function fail(e){cancelAnimationFrame(raf);msg.textContent='WebGPU: '+(e?.message||String(e));save.disabled=true;console.error(e);}
function dispose(){dead=true;cancelAnimationFrame(raf);try{pt?.dispose();renderer?.dispose();}catch(e){console.warn(e)}}
$('close').onclick=()=>{dispose();parent.FORMA_CLOSE_WEBGPU_R162?.();};window.addEventListener('pagehide',dispose,{once:true});window.addEventListener('unhandledrejection',e=>{e.preventDefault();fail(e.reason);});window.addEventListener('error',e=>fail(e.error||e.message));
save.onclick=()=>{saveRequested=true;if(pt?.complete)draw();};
function download(){renderer.domElement.toBlob(b=>{if(!b){msg.textContent='Не удалось сохранить PNG.';return;}const a=document.createElement('a');a.download='FORMA-WebGPU-'+settings.w+'x'+settings.h+'.png';a.href=URL.createObjectURL(b);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);},'image/png');}
function draw(){if(dead)return;try{pt.renderSample();if(saveRequested){saveRequested=false;download();}if(!pt.complete)raf=requestAnimationFrame(draw);else msg.textContent='Готово · '+settings.samples+' сэмплов на пиксель';}catch(e){fail(e);}}
window.FORMA_WEBGPU_START_R162=async (payload)=>{try{settings=payload.settings;if(!navigator.gpu)throw Error('WebGPU не поддерживается браузером.');msg.textContent='Проверка GPU и загрузка библиотек…';const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});if(!adapter)throw Error('Нет совместимого WebGPU-адаптера.');if(dead)return;const T=await import('three/webgpu');const {WebGPUPathTracer,TRANSMISSIVE_BACKGROUND_ENVIRONMENT}=await import('https://cdn.jsdelivr.net/gh/gkjohnson/three-gpu-pathtracer@9ee234a8f8604bbd4037cd6875e5ecd8c0d7e0a7/src/webgpu/index.js');if(dead)return;
 renderer=new T.WebGPURenderer({antialias:false,alpha:false,powerPreference:'high-performance',trackTimestamp:adapter.features.has('timestamp-query')});await renderer.init();if(!renderer.backend?.isWebGPUBackend)throw Error('Не удалось создать именно WebGPU-бэкенд.');if(dead){renderer.dispose();return;}renderer.backend.device?.lost.then(info=>{if(!dead)fail(Error('GPU отключён: '+info.message));});renderer.backend.device?.addEventListener('uncapturederror',e=>fail(e.error));renderer.setPixelRatio(1);renderer.setSize(settings.w,settings.h,false);renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=settings.exposure;renderer.domElement.style.cssText='width:100%;height:100%;object-fit:contain';$('view').append(renderer.domElement);
 msg.textContent='Восстановление сцены и текстур…';const loader=new T.ObjectLoader();loadedScene=await loader.parseAsync(payload.scene);const camera=loader.parse(payload.camera);if(dead)return;camera.aspect=settings.w/settings.h;if(camera.isPerspectiveCamera){if(Number.isFinite(settings.focal))camera.setFocalLength(settings.focal);else camera.updateProjectionMatrix();}else if(camera.isOrthographicCamera){const c=(camera.left+camera.right)/2,h=(camera.top-camera.bottom)/2;camera.left=c-h*camera.aspect;camera.right=c+h*camera.aspect;camera.updateProjectionMatrix();}camera.updateMatrixWorld(true);loadedScene.updateMatrixWorld(true);
 pt=new WebGPUPathTracer(renderer);pt.maxSamples=settings.samples;pt.maxBounces=settings.bounces;pt.maxTransparentBounces=28;pt.frameBudget=180000;pt.targetFrameTime=22;pt.adaptiveFrameBudget=adapter.features.has('timestamp-query');pt.dynamicLowRes=false;pt.renderDelay=0;pt.fadeDuration=0;pt.renderScale=1;pt.filterGlossyFactor=.3;pt.transmissiveBackground=TRANSMISSIVE_BACKGROUND_ENVIRONMENT;pt.addEventListener('progress',e=>{if(dead)return;const names={building:'Построение BVH',compiling:'Компиляция GPU',rendering:'Трассировка WebGPU',denoising:'Шумоподавление'};msg.textContent=names[e.stage]||e.stage||'Трассировка';if(Number.isFinite(e.progress))bar.value=e.progress;if(e.samples){const n=e.samples;msg.textContent+=' · '+Number(n.avg||0).toFixed(1)+' / '+settings.samples;save.disabled=!(n.avg>=1);$('stats').textContent=settings.w+' × '+settings.h+' · минимум '+(n.min??0)+' · '+Number(n.samplesPerSecond||0).toFixed(2)+' сэмпл/с';}});pt.addEventListener('complete',()=>{save.disabled=false;bar.value=1;});msg.textContent='Построение BVH · инстансы сохраняются…';await pt.setScene(loadedScene,camera);if(dead)return;draw();
 }catch(e){fail(e);}};
parent.FORMA_WEBGPU_READY_R162?.();
</script><script>setTimeout(()=>{if(!window.FORMA_WEBGPU_START_R162)document.getElementById('msg').textContent='Не удалось загрузить модуль WebGPU.';},15000);</script></body></html>
