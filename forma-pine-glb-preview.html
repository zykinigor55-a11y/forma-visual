<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORMA | Mature Scots pine · GLB visual quality gate</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#d9dcd6;color:#24352f;font:14px system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;top:16px;left:16px;background:#182723e0;color:#f5f4e7;border:1px solid #62756a;padding:13px 17px;border-radius:13px;max-width:260px;line-height:1.6}
.overlay strong{letter-spacing:.14em}.overlay small{color:#b9c8bd}#result{margin-top:5px}

#controls{margin-top:12px;display:grid;gap:6px;border-top:1px solid #55665b;padding-top:12px}
#controls[hidden]{display:none}
#controls label{display:flex;justify-content:space-between;font-size:11px;gap:6px}
#controls output{font-weight:700;color:#e9c79a}
#controls input[type=range]{width:100%;accent-color:#e6c89a}
#controls .ratio{justify-content:flex-start;align-items:center;min-height:27px;line-height:1.3}
#controls .ratio input{accent-color:#e6c89a}
#controls .presets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
#controls button{border-radius:7px;border:1px solid #8e7c5f;padding:7px 5px;background:#344239;color:#f5e6c8;font-size:11px;cursor:pointer}
#controls button:hover{background:#566047}
.overlay{z-index:3}
@media(max-width:520px){.overlay{top:8px;left:8px;max-width:210px;padding:10px 12px;font-size:12px}#controls{gap:4px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
</head>
<body><canvas id="preview"></canvas><div class="overlay"><strong>FORMA · PINUS SYLVESTRIS</strong><div id="result">Загружаем реальную модель…</div><small>GLB CC0 · 14 × 7 м · текстура коры + хвоя</small>
<div id="controls" hidden>
 <label for="hSize">Высота <output id="hOut">14,0 м</output></label>
 <input id="hSize" type="range" min="2" max="40" step=".5" value="14">
 <label for="dSize">Диаметр кроны <output id="dOut">7,0 м</output></label>
 <input id="dSize" type="range" min=".5" max="30" step=".5" value="7">
 <label class="ratio" for="ratioLock"><input id="ratioLock" type="checkbox" checked> Сохранять пропорции</label>
 <div class="presets"><button type="button" data-size="5,2.5">5 м · молодая</button><button type="button" data-size="9,4.5">9 м · подросшая</button><button type="button" data-size="14,7">14 м · взрослая</button><button type="button" data-size="20,10">20 м · крупная</button></div>
 <small>Потяните дерево мышью для поворота. Размер меняется без повторной загрузки GLB.</small>
</div></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {KTX2Loader} from 'three/addons/loaders/KTX2Loader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {makeRealVegetation} from './forma-landscape-3d-models.js';
const canvas=document.querySelector('#preview'),result=document.querySelector('#result');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,preserveDrawingBuffer:true});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.setPixelRatio(1);
const scene=new THREE.Scene();scene.background=new THREE.Color('#d4d8d1');
scene.fog=new THREE.Fog('#d4d8d1',55,90);
scene.add(new THREE.HemisphereLight('#f4faff','#92a28d',2.1));
const sun=new THREE.DirectionalLight('#ffedd5',3.0);
sun.position.set(-17,26,16);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-15;sun.shadow.camera.right=15;
sun.shadow.camera.top=20;sun.shadow.camera.bottom=-15;sun.shadow.normalBias=.03;
scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(38,38),new THREE.MeshStandardMaterial({color:'#7e957b',roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const camera=new THREE.PerspectiveCamera(34,1,.1,120);
function resize(){
 const w=Math.max(320,window.innerWidth),h=Math.max(360,window.innerHeight);
 renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
}
let visualHeight=14,visualCrown=7,viewYaw=0,viewZoom=1;
function view(yaw=viewYaw,elev=.26,distance=null){
 resize();
 viewYaw=yaw;
 const lookY=visualHeight*.52;
 const radius=distance??Math.max(27,visualHeight*2.25,visualCrown*4)*viewZoom;
 camera.position.set(Math.sin(yaw)*radius,lookY+Math.sin(elev)*radius,Math.cos(yaw)*radius);
 camera.lookAt(0,lookY,0);renderer.render(scene,camera);
}
window.__pineView=view;
window.addEventListener('resize',()=>view());
let dragStart=null;
canvas.addEventListener('pointerdown',event=>{dragStart=event.clientX;canvas.setPointerCapture?.(event.pointerId)});
canvas.addEventListener('pointermove',event=>{if(dragStart===null)return;viewYaw+=(event.clientX-dragStart)*.006;dragStart=event.clientX;view(viewYaw,.20)});
canvas.addEventListener('pointerup',()=>{dragStart=null});
canvas.addEventListener('pointercancel',()=>{dragStart=null});
canvas.addEventListener('wheel',event=>{event.preventDefault();viewZoom=Math.max(.6,Math.min(2.2,viewZoom*(event.deltaY>0?1.08:.92)));view(viewYaw,.20)},{passive:false});
try{
 const pineKtx2=new KTX2Loader().setTranscoderPath('/assets/three-basis/').setWorkerLimit(2);
 pineKtx2.detectSupport(renderer);
 const altPine=new URLSearchParams(location.search).get('alt')==='1';
 const modelUrl=altPine?'/assets/landscape-models/pine-mature-innerscene-cc0.glb':'/assets/landscape-models/pine-mature-cc0.glb';
 const loaded=await new GLTFLoader().setKTX2Loader(pineKtx2).setMeshoptDecoder(MeshoptDecoder).loadAsync(modelUrl);
 pineKtx2.dispose();
 const denseCanopy=new URLSearchParams(location.search).get('dense')==='1';
 const group=makeRealVegetation(THREE,loaded.scene,{catalogId:'pine',height:14,diameter:7},{shareGeometry:true,canopyCopies:denseCanopy?2:0});
 scene.add(group);
 const box=new THREE.Box3().setFromObject(group),size=box.getSize(new THREE.Vector3());
 let leafMaterials=0,barkMaterials=0,meshes=0;
 group.traverse(o=>{if(!o.isMesh)return;meshes++;for(const m of (Array.isArray(o.material)?o.material:[o.material])){
  if(m?.alphaTest>0||m?.transparent)leafMaterials++;else barkMaterials++;
 }});
 result.textContent='Готово · '+meshes+' меша · '+leafMaterials+' материала хвои · '+barkMaterials+' коры'+(denseCanopy?' · густая крона':'')+(altPine?' · альтернатива Innerscene':'');
 window.__pineDetails={meshes,leafMaterials,barkMaterials,height:size.y,diameter:Math.max(size.x,size.z),source:altPine?'innerscene':'tevy'};
 window.__pineReady=true;
 const controls=document.querySelector('#controls');
 const hs=document.querySelector('#hSize'),ds=document.querySelector('#dSize'),lock=document.querySelector('#ratioLock');
 const refresh=()=>{
  visualHeight=Number(hs.value);visualCrown=Number(ds.value);
  group.scale.set(visualCrown/7,visualHeight/14,visualCrown/7);
  document.querySelector('#hOut').textContent=visualHeight.toFixed(1).replace('.',',')+' м';
  document.querySelector('#dOut').textContent=visualCrown.toFixed(1).replace('.',',')+' м';
  renderer.shadowMap.needsUpdate=true;
  window.__pineDetails.height=visualHeight;window.__pineDetails.diameter=visualCrown;
  view(viewYaw,.20);
 };
 hs.addEventListener('input',()=>{
  if(lock.checked)ds.value=String(Math.round(Number(hs.value)*5)/10);
  refresh();
 });
 ds.addEventListener('input',refresh);
 lock.addEventListener('change',()=>{ds.disabled=lock.checked});
 controls.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{
  const [h,d]=button.dataset.size.split(',').map(Number);
  hs.value=String(h);ds.value=String(d);refresh();
 }));
 ds.disabled=true;controls.hidden=false;
 view(0,.20);
}catch(error){result.textContent='Ошибка: '+error.message;window.__pineError=String(error)}
</script></body></html>
